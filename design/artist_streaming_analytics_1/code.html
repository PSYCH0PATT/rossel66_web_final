<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Grained Artist Login | ROSSEL</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Syncopate:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#10b981", // Emerald 500
                        "background-dark": "#020202",
                        "accent-azure": "#0ea5e9", // Sky 500
                        "accent-emerald": "#10b981", // Emerald 500
                    },
                    fontFamily: {
                        display: ["Syncopate", "sans-serif"],
                        body: ["Space Grotesk", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                    },
                    animation: {
                        'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                },
            },
        };
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #020202;
        }
        .font-display {
            font-family: 'Syncopate', sans-serif;
        }
        .glass-panel {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(5, 5, 5, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.15; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }
        .grid-bg {
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.2);
        }
    </style>
</head>
<body class="bg-background-dark text-gray-100 min-h-screen relative overflow-hidden flex items-center justify-center">
<div class="noise-overlay"></div>
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] rounded-full bg-accent-azure blur-[180px] opacity-[0.1] animate-pulse-slow"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[70%] h-[70%] rounded-full bg-accent-emerald blur-[180px] opacity-[0.1]"></div>
<div class="absolute top-[30%] left-[50%] transform -translate-x-1/2 w-[40%] h-[40%] rounded-full bg-purple-900 blur-[150px] opacity-[0.08]"></div>
</div>
<div class="fixed inset-0 z-0 grid-bg pointer-events-none opacity-30"></div>
<main class="relative z-10 w-full max-w-md p-6">
<div class="glass-panel rounded-3xl p-8 md:p-10 w-full relative overflow-hidden border-t border-white/10 shadow-[0_0_50px_-10px_rgba(0,0,0,0.8)]">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"></div>
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/5 border border-white/10 mb-6 backdrop-blur-md shadow-[0_0_20px_rgba(16,185,129,0.15)] animate-float">
<span class="material-symbols-outlined text-3xl text-primary glow-text">graphic_eq</span>
</div>
<h1 class="font-display font-bold text-3xl tracking-[0.2em] text-white mb-2 glow-text">ROSSEL</h1>
<p class="text-xs font-mono text-gray-400 uppercase tracking-widest">Artist Portal Access</p>
</div>
<form class="space-y-6">
<div class="space-y-2">
<label class="block text-xs font-mono text-gray-400 uppercase tracking-wider ml-1" for="email">Artist ID / Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-500 group-focus-within:text-accent-azure transition-colors text-xl">alternate_email</span>
</div>
<input class="block w-full pl-12 pr-4 py-3.5 bg-black/40 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:border-accent-azure/50 focus:ring-1 focus:ring-accent-azure/50 transition-all duration-300 input-glow font-mono text-sm" id="email" placeholder="Enter your ID" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block text-xs font-mono text-gray-400 uppercase tracking-wider" for="password">Access Key</label>
<a class="text-[10px] text-accent-azure hover:text-white transition-colors uppercase tracking-wider font-bold" href="#">Forgot Key?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-500 group-focus-within:text-accent-azure transition-colors text-xl">key</span>
</div>
<input class="block w-full pl-12 pr-4 py-3.5 bg-black/40 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:border-accent-azure/50 focus:ring-1 focus:ring-accent-azure/50 transition-all duration-300 input-glow font-mono text-sm" id="password" placeholder="••••••••••••" type="password"/>
</div>
</div>
<div class="flex items-center ml-1 pt-2">
<input class="h-4 w-4 rounded border-gray-600 bg-black/40 text-primary focus:ring-offset-black focus:ring-primary/50 transition-colors" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-xs text-gray-400 font-mono" for="remember-me">Keep session active</label>
</div>
<button class="w-full mt-8 group relative flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-xl text-black bg-primary hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-black focus:ring-primary transition-all duration-300 shadow-[0_0_20px_rgba(16,185,129,0.2)] hover:shadow-[0_0_30px_rgba(16,185,129,0.4)] overflow-hidden" type="button">
<span class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></span>
<span class="uppercase tracking-widest flex items-center gap-2 relative z-10">
                        Sign In
                        <span class="material-symbols-outlined text-lg transition-transform group-hover:translate-x-1">arrow_forward</span>
</span>
</button>
</form>
<div class="mt-8 text-center border-t border-white/5 pt-6">
<p class="text-xs text-gray-500 font-mono">
                    Restricted Access. Authorized Personnel Only.<br/>
<span class="text-gray-600 mt-2 block">v.2.4.0-stable</span>
</p>
</div>
</div>
<div class="mt-8 flex justify-center gap-6 opacity-40">
<span class="w-1 h-1 rounded-full bg-white"></span>
<span class="w-1 h-1 rounded-full bg-white"></span>
<span class="w-1 h-1 rounded-full bg-white"></span>
</div>
</main>

</body></html>
