services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rossel
      POSTGRES_PASSWORD: rossel
      POSTGRES_DB: rossel_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rossel -d rossel_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
