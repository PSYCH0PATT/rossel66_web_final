name: forms-ci

on:
  pull_request:
    branches: [main, master, staging]
  push:
    branches: [main, master, staging]

concurrency:
  group: forms-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Typecheck (strict)
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Typecheck tests
        run: pnpm exec tsc --noEmit -p tsconfig.tests.json
        continue-on-error: true

      - name: Production build
        run: pnpm build
        env:
          # Build must not require live secrets; provide placeholders for Prisma generate
          DATABASE_URL: postgresql://rossel:rossel@127.0.0.1:54329/rossel_test
          DIRECT_URL: postgresql://rossel:rossel@127.0.0.1:54329/rossel_test
          AUTH_SECRET: ci-build-auth-secret
          CRON_SECRET: ci-build-cron-secret
          PYRUS_WRITE_DISABLED: "true"
          BUILDIN_DUAL_WRITE: "false"
