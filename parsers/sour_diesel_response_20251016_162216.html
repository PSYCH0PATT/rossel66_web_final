st__text_17\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e вы\u0026nbsp;можете добавлять пиксели ретаргетинга вручную к\u0026nbsp;каждой или\u0026nbsp;отдельным страницам BandLink, а\u0026nbsp;можете один раз указать их\u0026nbsp;в\u0026nbsp;соответствующем блоке раздела \u003cspan class='red'\u003e\u0026laquo;Настройки\u0026raquo;\u003c/span\u003e в\u0026nbsp;личном кабинете\u0026nbsp;\u0026mdash; так коды пикселей будут автоматически прописываться в\u0026nbsp;каждом новом смартлинке.\",\"the_list__text_18\":\"*Компания Meta, владеющая Facebook и\u0026nbsp;Instagram, признана в\u0026nbsp;России экстремистской организацией. В\u0026nbsp;связи с\u0026nbsp;этим отображение ссылок на\u0026nbsp;данные сервисы на\u0026nbsp;территории России отключено.\",\"the_list__text_19\":\"Все изменения в\u0026nbsp;настройках модуля сохраняются автоматически.\"},\"modules_presaves\":{\"the_promo_background__title\":\"Пресейвы\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить к\u0026nbsp;вашей страничке BandLink пресейв, а\u0026nbsp;также собрать электронные адреса тех, кто сохранил себе ваш релиз ещё\u0026nbsp;до\u0026nbsp;его\u0026nbsp;выхода, для дальнейшего взаимодействия с\u0026nbsp;аудиторией, например, для рассылки этим слушателям подарков в\u0026nbsp;благодарность за\u0026nbsp;пресейв.\",\"the_list__text\":\"Пресейв\",\"the_list__text_2\":\"Это аналог предзаказа на\u0026nbsp;скачивание релиза. Фанаты смогут сохранить ваш альбом ещё до\u0026nbsp;его официального выхода, и\u0026nbsp;он\u0026nbsp;будет автоматически добавлен в\u0026nbsp;их\u0026nbsp;библиотеки на\u0026nbsp;Яндекс Музыке, Spotify или Apple Music в\u0026nbsp;день выхода.\",\"the_list__text_3\":\"В\u0026nbsp;данном модуле выберите в\u0026nbsp;выпадающем меню нужный музыкальный сервис и\u0026nbsp;добавьте UPC-код релиза. Получить его вы\u0026nbsp;можете у\u0026nbsp;своего дистрибьютора.\",\"the_list__text_4\":\"Нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Сохранить\u0026raquo;\u003c/span\u003e после того, как вставите код UPC. В\u0026nbsp;дальнейшем здесь\u0026nbsp;же вы\u0026nbsp;сможете увидеть количество сделанных слушателями пресейвов.\",\"the_list__text_5\":\"Чтобы добавить пресейв на\u0026nbsp;других стриминговых площадках, нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить пресейв\u0026raquo;\u003c/span\u003e. Затем выберите нужный сервис, укажите UPC-код будущего релиза и\u0026nbsp;нажмите \u003cspan class='red'\u003e\u0026laquo;Сохранить\u0026raquo;\u003c/span\u003e.\",\"the_list__text_6\":\"Создать пресейв вы\u0026nbsp;можете на\u0026nbsp;всех трёх площадках, если отгружали на\u0026nbsp;них свой новый релиз.\",\"the_list__text_7\":\"Подробнее о\u0026nbsp;создании и\u0026nbsp;настройке страницы пресейва читайте \u003ca href='{presaveLink}' target='_blank' class='red'\u003eтут\u003c/a\u003e.\"},\"modules_campaigns\":{\"the_promo_background__title\":\"Кампании\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Продвижение\u0026raquo;\u003c/span\u003e и\u0026nbsp;предоставляет вам удобный инструмент отслеживания эффективности разных источников трафика или рекламных кампаний.\",\"the_list__text\":\"Просто создайте дубликаты основной ссылки BandLink и\u0026nbsp;следите за\u0026nbsp;аналитикой каждой из\u0026nbsp;них, чтобы найти самый эффективный канал распространения.\",\"the_list__text_2\":\"Данный модуль поможет вам отследить эффективность разных рекламных кампаний и\u0026nbsp;каналов продвижения вашего творчества. Это\u0026nbsp;важный элемент менеджмента. Он\u0026nbsp;помогает оптимизировать будущие пути распространения и\u0026nbsp;продаж релизов, билетов на\u0026nbsp;ваши выступления и\u0026nbsp;т.д.\",\"the_list__text_3\":\"В\u0026nbsp;настройках модуля вы\u0026nbsp;можете выбрать \u003cspan class='red'\u003e\u0026laquo;Домен ссылки\u0026raquo;\u003c/span\u003e. По\u0026nbsp;умолчанию предлагается два варианта: band.link или bnd.lc.\",\"the_list__text_4\":\"Далее с\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Добавить\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете создать любое количество дубликатов основной ссылки для ваших рекламных кампаний.\",\"the_list__text_5\":\"При этом сам смартлинк будет один и\u0026nbsp;тот\u0026nbsp;же, просто разные ссылки на\u0026nbsp;него вы\u0026nbsp;сможете распространять по\u0026nbsp;разным каналам, чтобы в\u0026nbsp;дальнейшем оценить эффективность каждого из\u0026nbsp;них в\u0026nbsp;отдельности.\",\"the_list__text_6\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Ссылка\u0026raquo;\u003c/span\u003e автоматически прописывается рандомно сгенерированное имя для каждой ссылки. Вы\u0026nbsp;можете задать ей\u0026nbsp;своё уникальное имя\u0026nbsp;(используйте при этом латиницу).\",\"the_list__text_7\":\"К\u0026nbsp;каждой новой ссылке не\u0026nbsp;забудьте добавить комментарий в\u0026nbsp;соответствующем поле, чтобы в\u0026nbsp;дальнейшем различать их\u0026nbsp;и\u0026nbsp;не\u0026nbsp;запутаться в\u0026nbsp;данных статистики.\",\"the_list__text_8\":\"Информация по\u0026nbsp;данным всех ссылок доступна в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Аналитика\u0026raquo;\u003c/span\u003e в\u0026nbsp;личном кабинете BandLink.\",\"the_list__text_9\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Копировать\u0026raquo;\u003c/span\u003e позволяет быстро скопировать любую ссылку в\u0026nbsp;буфер обмена. Опция открывается нажатием на\u0026nbsp;иконку шестерёнки справа от\u0026nbsp;ссылки. Также вы\u0026nbsp;можете удалить ненужную ссылку.\",\"the_list__text_10\":\"Не\u0026nbsp;забудьте \u003cspan class='red'\u003e\u0026laquo;Сохранить\u0026raquo;\u003c/span\u003e всю обновлённую информацию.\"},\"modules_widget\":{\"the_promo_background__title\":\"Виджет\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Продвижение\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет вам сгенерировать HTML-код страницы BandLink, чтобы\u0026nbsp;отобразить её\u0026nbsp;в\u0026nbsp;виде виджета на\u0026nbsp;вашем или\u0026nbsp;партнёрском\u0026nbsp;сайте.\",\"the_list__text\":\"С\u0026nbsp;помощью кнопок-ползунков отредактируйте вид и\u0026nbsp;содержание виджета. Вы\u0026nbsp;можете включить или выключить необходимые модули смартлинка:\",\"the_list__text_2\":\"— Ленту новостей\",\"the_list__text_3\":\"— Обложку\",\"the_list__text_4\":\"— Заголовок\",\"the_list__text_5\":\"— Видео\",\"the_list__text_6\":\"— Аудиоплеер\",\"the_list__text_7\":\"— Официальные ссылки\",\"the_list__text_8\":\"— Тему оформления\",\"the_list__text_9\":\"Выбранные модули будут отображаться в\u0026nbsp;виджете смартлинка на\u0026nbsp;вашем сайте.\",\"the_list__text_10\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e для активации выбранных параметров виджета у\u0026nbsp;вас должна быть заполнена информация в\u0026nbsp;соответствующих модулях настроек страницы BandLink.\",\"the_list__text_11\":\"Здесь\u0026nbsp;же вы\u0026nbsp;можете задать ширину и\u0026nbsp;высоту виджета в\u0026nbsp;специальных полях настроек.\",\"the_list__text_12\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Копировать код\u0026raquo;\u003c/span\u003e позволяет скопировать HTML-код виджета, чтобы\u0026nbsp;вставить его на\u0026nbsp;ваш сайт.\",\"the_list__text_13\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_gating\":{\"the_promo_background__title\":\"Гейтинг\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Продвижение\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет отобразить на\u0026nbsp;вашей страничке BandLink ссылку на\u0026nbsp;дополнительный контент для пользователей, которые подпишутся на\u0026nbsp;ваши социальные сети.\",\"the_list__text\":\"Гейтинг позволяет привлечь и\u0026nbsp;заинтересовать новую аудиторию и\u0026nbsp;увеличить количество подписчиков.\",\"the_list__text_2\":\"С\u0026nbsp;помощью этого модуля настроек вы\u0026nbsp;можете предложить слушателям подписаться на\u0026nbsp;вашу группу во\u0026nbsp;ВКонтакте, на\u0026nbsp;email-рассылку, Spotify, Telegram или Яндекс Музыку.\",\"the_list__text_3\":\"В\u0026nbsp;выпадающем меню \u003cspan class='red'\u003e\u0026laquo;Имя сервиса\u0026raquo;\u003c/span\u003e выберете интересующую вас площадку для подписки (например, группу во\u0026nbsp;ВКонтакте).\",\"the_list__text_4\":\"Нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить гейт\u0026raquo;\u003c/span\u003e\u0026nbsp;\u0026mdash; откроется новое окно настроек.\",\"the_list__text_5\":\"В\u0026nbsp;этом окне введите ссылку на\u0026nbsp;выбранный сервис (например, на\u0026nbsp;вашу группу во\u0026nbsp;ВКонтакте) и\u0026nbsp;добавьте ссылку, которую пользователь получит в\u0026nbsp;качестве подарка за\u0026nbsp;подписку.\",\"the_list__text_6\":\"Это\u0026nbsp;может быть:\",\"the_list__text_7\":\"ссылка на\u0026nbsp;эксклюзивный контент, которого нет в\u0026nbsp;свободном доступе;\",\"the_list__text_8\":\"скидка на\u0026nbsp;ваш мерч или билеты на\u0026nbsp;концерт;\",\"the_list__text_9\":\"любой промокод от\u0026nbsp;вас или ваших партнёров;\",\"the_list__text_10\":\"что угодно ещё\u0026nbsp;\u0026mdash; все зависит от\u0026nbsp;вашего креатива.\",\"the_list__text_11\":\"Не\u0026nbsp;забудьте \u003cspan class='red'\u003e\u0026laquo;Сохранить\u0026raquo;\u003c/span\u003e обновлённые настройки модуля\",\"the_list__text_12\":\"Чтобы добавить блок подписки ещё на\u0026nbsp;один сервис, выберите его\u0026nbsp;в\u0026nbsp;выпадающем списке и\u0026nbsp;нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить гейт\u0026raquo;\u003c/span\u003e. Далее заполните поля в\u0026nbsp;открывшемся окне настроек и\u0026nbsp;сохраните.\",\"the_list__text_13\":\"Дальнейшие действия аналогичны описанным выше: укажите ссылку, по\u0026nbsp;которой пользователь\u0026nbsp;сможет подписаться на\u0026nbsp;вас, затем добавьте ссылку, которую он\u0026nbsp;получит за\u0026nbsp;подписку, и\u0026nbsp;нажмите \u003cspan class='red'\u003e\u0026laquo;Сохранить\u0026raquo;\u003c/span\u003e.\",\"the_list__text_14\":\"Вы\u0026nbsp;можете настроить гейтинг как на\u0026nbsp;один из\u0026nbsp;предложенных сервисов, так и\u0026nbsp;на\u0026nbsp;все сразу.\",\"the_list__text_15\":\"Так каждый, кто подпишется на\u0026nbsp;вас, получит подарок по\u0026nbsp;секретной ссылке, а\u0026nbsp;вы\u0026nbsp;получите новых подписчиков и\u0026nbsp;расширите свою аудиторию.\",\"the_list__text_16\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_photos\":{\"the_promo_background__title\":\"Фотогалерея\",\"app_title__title\":\"Данный модуль позволяет добавить к\u0026nbsp;вашей страничке BandLink до\u0026nbsp;15\u0026nbsp;фотографий.\",\"the_list__text\":\"Этот модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e лишь у\u0026nbsp;четырёх страниц BandLink: Артиста, Подкастера, Лейбла и\u0026nbsp;Клуба.\",\"the_list__text_2\":\"Придумайте цепляющий \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e, чтобы привлечь внимание ваших фанатов. Учтите: заголовок отображается только в\u0026nbsp;десктопной версии смартлинка.\",\"the_list__text_3\":\"С\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Добавить\u0026raquo;\u003c/span\u003e загрузите изображения с\u0026nbsp;вашего устройства на\u0026nbsp;страничку BandLink (размер: не\u0026nbsp;более 10\u0026nbsp;МБ; допустимые форматы: JPG, PNG).\",\"the_list__text_4\":\"Каждую загруженную фотографию вы\u0026nbsp;можете подписать: для этого заполните специальное поле \u003cspan class='red'\u003e\u0026laquo;Текст\u0026raquo;\u003c/span\u003e.\",\"the_list__text_5\":\"Чтобы удалить фотографию из\u0026nbsp;галереи, нажмите на\u0026nbsp;соответствующую кнопку рядом с\u0026nbsp;изображением.\",\"the_list__text_6\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e вы\u0026nbsp;не\u0026nbsp;сможете изменить порядок расположения фотографий, поэтому сразу загружайте их\u0026nbsp;в\u0026nbsp;желаемой последовательности.\",\"the_list__text_7\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_text\":{\"the_promo_background__title\":\"Текстовый блок\",\"app_title__title\":\"Данный модуль позволяет добавить к\u0026nbsp;вашей странице BandLink дополнительный текстовый блок, который поможет ещё\u0026nbsp;больше\u0026nbsp;рассказать о\u0026nbsp;вас и\u0026nbsp;вашем проекте.\",\"the_list__text\":\"Этот модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e лишь у\u0026nbsp;четырёх страниц BandLink: Артиста, Подкастера, Лейбла и\u0026nbsp;Клуба.\",\"the_list__text_2\":\"Придумайте цепляющий \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e, чтобы привлечь внимание ваших фанатов к\u0026nbsp;этой информации. Обратите внимание: заголовок отображается только в\u0026nbsp;десктопной версии смартлинка.\",\"the_list__text_3\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Текст\u0026raquo;\u003c/span\u003e введите информацию, которой хотите поделиться с\u0026nbsp;аудиторией. Количество символов не\u0026nbsp;огран
