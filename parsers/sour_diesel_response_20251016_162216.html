",\"the_scroll_view__description_6\":\"Это поможет новым слушателям найти вас в\u0026nbsp;соцсетях и\u0026nbsp;подписаться на\u0026nbsp;вас, чтобы не\u0026nbsp;пропускать важные сообщения\",\"the_scroll_view__title_7\":\"Блок подписки\",\"the_scroll_view__description_7\":\"С\u0026nbsp;ним пользователи смогут подписаться на\u0026nbsp;вашу email-рассылку, группу во\u0026nbsp;ВКонтакте или телеграм-канал, а\u0026nbsp;вы\u0026nbsp;сможете собрать базу подписавшихся, чтобы в\u0026nbsp;будущем точечно сообщить им\u0026nbsp;о\u0026nbsp;новых релизах, концертах и\u0026nbsp;других важных новостях\",\"the_possibilities__title\":\"Ещё больше возможностей страницы конструктора\",\"the_possibilities__dropdown_title_1\":\"Модуль \u0026laquo;Гейтинг\u0026raquo;\",\"the_possibilities__dropdown_holder_1\":\"С\u0026nbsp;ним за\u0026nbsp;подписку на\u0026nbsp;рассылку, ваши соцсети или стриминги слушатели смогут получить подарок. Например, скидку на\u0026nbsp;мерч или ссылку на\u0026nbsp;эксклюзивный контент\",\"the_possibilities__dropdown_title_2\":\"Выбор разных доменов\",\"the_possibilities__dropdown_holder_2\":\"\u003ca target='_blank' href='{firstDomen}'\u003eband.link\u003c/a\u003e, \u003ca target='_blank' href='{secondDomen}'\u003ebnd.lc\u003c/a\u003e, \u003ca target='_blank' href='{thirdDomen}'\u003emuz.lc\u003c/a\u003e или \u003ca target='_blank' href='{fourthDomen}'\u003eblgr.lc\u003c/a\u003e\",\"the_possibilities__dropdown_title_3\":\"Пиксель ретаргетинга\",\"the_possibilities__dropdown_holder_3\":\"Собирайте данные об\u0026nbsp;аудитории и\u0026nbsp;настраивайте таргетированную рекламу в\u0026nbsp;соцсетя\",\"the_possibilities__dropdown_title_4\":\"Настройка уникального вида ссылки\",\"the_possibilities__dropdown_holder_4\":\"Например, \u003ca href='{uniqueType}'\u003ebnd.lc/name_of_artist\u003c/a\u003e\",\"the_possibilities__dropdown_title_5\":\"Реклама с\u0026nbsp;Яндекс Директом\",\"the_possibilities__dropdown_holder_5\":\"Запускайте и\u0026nbsp;пользуйтесь дополнительн ;личный кабинет BandLink, откройте в\u0026nbsp;настройки страницы. Перейдите в\u0026nbsp;модуль \u0026laquo;Гейтинг\u0026raquo; и\u0026nbsp;выберите, на\u0026nbsp;что предлагаете подписаться своим слушателям: это может быть группа ВКонтакте, email-рассылка, телеграм-канал, а\u0026nbsp;также страница артиста на\u0026nbsp;Яндекс Музыке или Spotify. Нажмите кнопку \u0026laquo;Добавить гейт\u0026raquo; и\u0026nbsp;укажите ссылку, по\u0026nbsp;которой слушатель подпишется на\u0026nbsp;вас, а\u0026nbsp;также ссылку, которую он\u0026nbsp;получит в\u0026nbsp;качестве подарка за\u0026nbsp;подписку. Вы\u0026nbsp;можете выбрать любой подарок: ссылку на\u0026nbsp;эксклюзивный контекст, скидку на\u0026nbsp;мерч, билеты на\u0026nbsp;концерт и\u0026nbsp;многое другое.\",\"the_questions__more_title\":\"Ещё больше информации\u0026nbsp;\u0026mdash; в\u0026nbsp;\",\"the_questions__more_link_title\":\"Справке\"},\"info_presave_page\":{\"the_promo__title\":\"Страница пресейва\",\"the_promo__description\":\"Привлеките к\u0026nbsp;своему релизу больше внимания и\u0026nbsp;увеличьте прослушивания ещё до\u0026nbsp;официального выхода релиза\",\"the_promo__main_button_conf__text\":\"Создать страницу\",\"the_advantages__title\":\"Как страница пресейва поможет \u003cbr /\u003e вам в\u0026nbsp;продвижении на\u0026nbsp;стримингах\",\"the_advantages__advantages__item_1__title\":\"Прогрейте аудиторию в\u0026nbsp;соцсетях\",\"the_advantages__advantages__item_1__description\":\"Делитесь ссылкой на\u0026nbsp;страницу с\u0026nbsp;пресейвом bandlink со\u0026nbsp;своими фанатами в\u0026nbsp;соцсетях, и\u0026nbsp;придумывайте бонусы за\u0026nbsp;оформление пресейва: так поклонники не\u0026nbsp;только услышат ваш релиз первыми, но\u0026nbsp;и\u0026nbsp;смогут получить \u003cbr class='desktop' /\u003e от\u0026nbsp;вас подарок. Например, открытку, мерч или проходку на\u0026nbsp;концерт.\",\"the_advantages__advantages__item_2__title\":\"Повысьте шансы на\u0026nbsp;успех релиза\",\"the_advantages__advantages__item_2__description\":\"Большое количество сохранений и\u0026nbsp;стримов в\u0026nbsp;первый\u0026nbsp;же день выхода релиза\u0026nbsp;\u0026mdash; показатель успеха не\u0026nbsp;только \u003cbr class='desktop' /\u003e для артиста, но\u0026nbsp;и\u0026nbsp;для алгоритмов музыкального сервиса: чем выше стартовая активность вокруг релиза, \u003cbr class='desktop'\u003e тем у\u0026nbsp;него больше шансов попасть в\u0026nbsp;Мою волну. Это в\u0026nbsp;свою очередь увеличивает ваши шансы стать заметнее \u003cbr class='desktop' /\u003e и\u0026nbsp;для редакции стримингов, и\u0026nbsp;для широкой аудитории.\",\"the_scroll_view__title\":\"Зачем создавать страницы пресейва в\u0026nbsp;BandLink на\u0026nbsp;релизы в\u0026nbsp;Яндекс Музыке\",\"the_scroll_view__scroll_items__item_1__title\":\"Привлечь внимание к\u0026nbsp;релизу еще до\u0026nbsp;его выхода на\u0026nbsp;площадках. Успех релиза во\u0026nbsp;многом зависит от\u0026nbsp;эффективности предрелизного промо: чем больше слушателей узнают о\u0026nbsp;них заранее, тем выше будет охват в\u0026nbsp;релизную неделю\",\"the_scroll_view__scroll_items__item_2__title\":\"Стать заметнее для алгоритмов и\u0026nbsp;рекомендательных систем стримингов. Если слушатель сделает пресейв, в\u0026nbsp;день выхода релиз автоматически получит лайк и\u0026nbsp;будет добавлен в\u0026nbsp;пользовательскую коллекцию в\u0026nbsp;блок \u0026laquo;Альбомы\u0026raquo; на\u0026nbsp;Яндекс Музыке. Так пресейв даёт алгоритмам понять, что ваши треки популярны и\u0026nbsp;их\u0026nbsp;стоит рекомендовать чаще\",\"the_scroll_view__scroll_items__item_3__title\":\"Привлечь внимание редакции Яндекс Музыки и\u0026nbsp;попасть в\u0026nbsp;редакционные плейлисты\",\"the_scroll_view__scroll_items__item_4__title\":\"Слушатели, сделавшие пресейв вашего релиза, будут чаще видеть баннер в\u0026nbsp;разделе \u0026laquo;Интересно сейчас\u0026raquo;, если редакция поддержит ваш релиз\",\"the_analytics__title\":\"Аналитика по\u0026nbsp;странице \u003cbr /\u003e в\u0026nbsp;личном кабинете\",\"the_analytics__list__item_1__title\":\"Отслеживайте трафик, просмотры и\u0026nbsp;клики\",\"the_analytics__list__item_1__description\":\"Так вы\u0026nbsp;сможете узнать самые эффективные источники трафика и\u0026nbsp;понять, что больше интересует вашу аудиторию\",\"the_analytics__list__item_2__title\":\"Изучайте свою аудиторию\",\"the_analytics__list__item_2__description\":\"Составьте портрет вашей аудитории по\u0026nbsp;полу и\u0026nbsp;возрасту. Это поможет лучше понимать кто ваши слушатели\",\"the_analytics__list__item_3__title\":\"Анализируйте географию\",\"the_analytics__list__item_3__description\":\"Узнавайте лучше географический диапазон ваших слушателей\u0026nbsp;\u0026mdash; это поможет планировать ваши будущие выступления и\u0026nbsp;турне\",\"the_groups__title\":\"Кто уже создал страницу пресейва\",\"the_groups__groups__item_1__title\":\"Группа \u0026laquo;ГАФТ\u0026raquo;\",\"the_groups__groups__item_1__subtitle__item_1\":\"За\u0026nbsp;полторы недели до\u0026nbsp;релиза группа ГАФТ запустила в\u0026nbsp;социальной сети кампанию с\u0026nbsp;открытками за\u0026nbsp;пресейв.\",\"the_groups__groups__item_1__subtitle__item_2\":\"Это не\u0026nbsp;просто приятная для поклонников акция, но\u0026nbsp;и\u0026nbsp;повод рассказать о\u0026nbsp;ней в\u0026nbsp;соцсетях, создав ещё больше шума вокруг предстоящего релиза.\",\"the_groups__groups__item_2__title\":\"Рэп-исполнитель L\u0026rsquo;ONE\",\"the_groups__groups__item_2__subtitle__item_1\":\"Рэпер Леван Горозия запустил на\u0026nbsp;странице пресейва bandlink конкурс к\u0026nbsp;своему новому альбому \u0026laquo;Дом\u0026raquo;: всем пользователям, сохранившим лонгплей до\u0026nbsp;его выхода, достались уникальные письма от\u0026nbsp;артиста, а\u0026nbsp;победителю\u0026nbsp;\u0026mdash; годовой абонемент с\u0026nbsp;двумя проходками на\u0026nbsp;все концерты L\u0026rsquo;One в\u0026nbsp;любом городе.\",\"the_groups__groups__item_2__subtitle__item_2\":\"Так аудитория получила приятные п \u003e и\u0026nbsp;продвижение. О\u0026nbsp;том, как настраивать модуль \u0026laquo;Кампании\u0026raquo; для отдельных \u003cbr class='desktop' /\u003e страниц BandLink, читайте \u003ca href='{companyModule}' target='_blank'\u003eтут\u003c/a\u003e.\",\"app_instruction_7__text\":\"Также вы\u0026nbsp;можете \u003cspan class='red'\u003eскачать отчёт\u003c/span\u003e в\u0026nbsp;одном из\u0026nbsp;двух форматов: PDF или CSV (формируется в\u0026nbsp;виде таблицы эксель). Это удобно для работы с\u0026nbsp;аналитикой офлайн, сохранения отчётов на\u0026nbsp;вашем устройстве, а\u0026nbsp;также, если вы\u0026nbsp;хотите поделиться статистикой.\",\"app_instruction_8__text\":\"Вы\u0026nbsp;можете подключить к\u0026nbsp;своим страницам BandLink \u003cspan class='red'\u003eсторонние сервисы аналитики\u003c/span\u003e: Яндекс Метрику и\u0026nbsp;Google Analytics.\",\"app_instruction_8__additional_text\":\"Для этого: зайдите в\u0026nbsp;настройки страницы, к\u0026nbsp;которой хотите подключить эти сервисы, нажав на\u0026nbsp;иконку шестерёнки в\u0026nbsp;личном кабинете BandLink;\",\"app_instruction_9__text\":\"Откройте модуль \u0026laquo;Сервисы аналитики\u0026raquo;;\",\"app_instruction_9__additional_text\":\"Добавьте коды отслеживания из\u0026nbsp;кабинета Яндекс Метрики или Google Analytic.\",\"app_instruction_9__image_text\":\"Подробнее о\u0026nbsp;данном модуле настроек вы\u0026nbsp;можете прочитать \u003ca href='{detailed}'\u003eтут\u003c/a\u003e.\",\"app_video_block__title\":\"BandLink Аналитика. Обзор блока \u0026quot;Новый релиз\u0026quot; / Опыт Артёма Захарова\"},\"info_help_analytics_analytics_yam_page\":{\"the_promo__title\":\"BandLink аналитика\",\"the_promo__description\":\"Из\u0026nbsp;этой статьи вы\u0026nbsp;узнаете, какая статистика представлена в\u0026nbsp;двух разделах BandLink Аналитики, что означают данные метрики и\u0026nbsp;как оценить динамику вашего проекта\",\"the_promo__main_button_conf__text\":\"Зарегистрироваться\",\"the_promo__secondary_button_conf__text\":\"Подробнее\",\"the_tabs__tabs__item_1__title\":\"Аналитика по\u0026nbsp;страницам BandLink\",\"the_tabs__tabs__item_2__title\":\"Аналитика со\u0026nbsp;статистикой \u003cbr /\u003e из\u0026nbsp;Яндекс Музыки\",\"app_title__title\":\"BandLink Аналитика \u003cbr /\u003e со\u0026nbsp;статистикой из\u0026nbsp;Яндекс Музыки\",\"app_title__description\":\"Данный раздел поможет получить эксклюзивную статистику по\u0026nbsp;всем ключевым метрикам на\u0026nbsp;Яндекс Музыке: от\u0026nbsp;общих данных о\u0026nbsp;слушателях и\u0026nbsp;релизах до\u0026nbsp;уникальной информации о\u0026nbsp;суперфанах.\",\"app_instruction__text\":\"Чтобы открыть раздел, нажмите на\u0026nbsp;кнопку \u0026laquo;Аналитика\u0026raquo; в\u0026nbsp;личном кабинете BandLink и\u0026nbsp;выберите подраздел \u0026laquo;Яндекс Музыка\u0026raquo;\",\"app_instruction_2__text\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e доступ к\u0026nbsp;этой информации есть только у\u0026nbsp;верифицированных пользователей сервиса.\u003cbr /\u003eО\u0026nbsp;том, как пройти верификацию, читайте \u003ca target='_blank' href='{aboutVerification}'\u003eтут\u003c/a\u003e.\",\"app_instruction_3__text\":\"Если с\u0026nbsp;помощью BandLink вы\u0026nbsp;ведёте несколько проектов, выберите, статистику по\u0026nbsp;какому из\u0026nbsp;них вы\u0026nbsp;хотите увидеть.\u003cbr /\u003e \u003cbr /\u003e Для этого нажмите на\u0026nbsp;выпадающее меню в\u0026nbsp;самом начале раздела.\",\"app_instruction_4__text\":\"Выберите интересующий вас временной период\u0026nbsp;\u0026mdash; и\u0026nbsp;сразу под ним увидите статистику\u0026nbsp;по:\",\"the_list__list__item_1__text\":\"количеству прослушиваний\",\"the_list__list__item_2__text\":\"слушателям\",\"the_list__list__item_3__text\":\"лайкам на треках\",\"the_list__list__item_4__text\":\"вовлечённости\",\"app_instruction_5__text\":\"\u003cspan class='red'\u003eКоличество прослушиваний\u003c/span\u003e\u0026nbsp;\u0026mdash; это статистика стримов за\u0026nbsp;выбранный период, которая может помочь оценить будущий доход.\",\"app_instruction_6__text\":\"Метрика \u003cspan class='red'\u003e\u0026laquo;Слушатели\u0026raquo;\u003c/span\u003e позволяет оценить объём вашей аудитории и\u0026nbsp;следить за\u0026nbsp;динамикой её\u0026nbsp;изменения.\",\"app_instruction_7__text\":\"\u003cspan class='red'\u003e\u0026laquo;Количество лайков на\u0026nbsp;треках\u0026raquo;\u003c/span\u003e показывает, сколько лайков получили ваши треки на\u0026nbsp;стримниге и\u0026nbsp;попали в\u0026nbsp;коллекции слушателей.\",\"app_instruction_8__text\":\"\u003cspan class='red'\u003eВовлечённость\u003c/span\u003e\u0026nbsp;\u0026mdash; это соотношение в\u0026nbsp;процентах между теми, кто слушал ваши треки, и\u0026nbsp;теми, и\u0026nbsp;теми, кто поставил им\u0026nbsp;лайк. Эта метрика поможет понять, на\u0026nbsp;какие ваши треки слушатели лучше всего реагируют.\",\"app_instruction_9__text\":\"Раздел \u003cspan class='red'\u003e\u0026laquo;Дневная динамика\u0026raquo;\u003c/span\u003e показывает, как меняется ваша статистика прослушиваний и\u0026nbsp;слушателей за\u0026nbsp;разные периоды времени\u0026nbsp;\u0026mdash; от\u0026nbsp;суток до\u0026nbsp;года. Это поможет понять, в\u0026nbsp;какие дни аудитория активнее слушает вашу музыку, а\u0026nbsp;когда происходят спады интереса. Исходя из\u0026nbsp;этого, можно планировать выпуск новых релизов..\",\"app_instruction_10__text\":\"Раздел \u003cspan class='red'\u003e\u0026laquo;Сводка по\u0026nbsp;трекам\u0026raquo;\u003c/span\u003e\u0026nbsp;\u0026mdash; это наглядная таблица, которая помогает сравнить ключевую статистику разных треков за\u0026nbsp;выбранный период:\",\"the_list_2__list__item_1__text\":\"количество прослушиваний\",\"the_list_2__list__item_2__text\":\"слушателей\",\"the_list_2__list__item_3__text\":\"лайков\",\"the_list_2__list__item_4__text\":\"вовлечённость\",\"the_list_2__list__item_5__text\":\"а\u0026nbsp;также важный дополнительный показатель\u0026nbsp;\u0026mdash; количество прослушиваний на\u0026nbsp;одного человека: позволяет понять, какие ваши песни слушатели переслушивают (а\u0026nbsp;значит любят) больше всего, то\u0026nbsp;есть эта метрика показывает, какие ваши треки заходят лучше всего.\",\"app_instruction_11__text\":\"Раздел \u003cspan class='red'\u003e\u0026laquo;Сводка по\u0026nbsp;релизам\u0026raquo;\u003c/span\u003e\u0026nbsp;\u0026mdash; это наглядная таблица, которая помогает сравнить ключевую статистику разных релизов за\u0026nbsp;выбранный период:\",\"the_list_3__list__item_1__text\":\"количество прослушиваний\",\"the_list_3__list__item_2__text\":\"слушателей\",\"the_list_3__list__item_3__text\":\"лайков\",\"the_list_3__list__item_4__text\":\"вовлечённость\",\"the_list_3__list__item_5__text\":\"а\u0026nbsp;также важный дополнительный показатель\u0026nbsp;\u0026mdash; количество треков в\u0026nbsp;релизе, которые дослушали до\u0026nbsp;конца. Эта метрика показывает, сколько треков из\u0026nbsp;релиза понравились вашей аудитории.\",\"app_instruction_12__text\":\"Отдельный блок аналитики со\u0026nbsp;статистикой из\u0026nbsp;Яндекс Музыки посвящён \u003cspan class='red'\u003eпортрету аудитории.\u003c/span\u003e\",\"app_instruction_13__text\":\"Он\u0026nbsp;выводит только за\u0026nbsp;28\u0026nbsp;дней и\u0026nbsp;отражает количество слушателей, суперфанов и\u0026nbsp;долю суперфанов от\u0026nbsp;всех слушателей.\",\"app_instruction_14__text\":\"\u003cspan class='red'\u003eСуперфаны\u0026nbsp;\u003c/span\u003e\u0026mdash; это уникальная метрика Яндекс Музыки, она показывает количество пользователей, которые послушали минимум три ваших разных трека на\u0026nbsp;стриминге за\u0026nbsp;последние 28\u0026nbsp;дней. Это ваши преданные слушатели, наиболее лояльная аудитория, на\u0026nbsp;которую можно рассчитывать при планировании релизной, концертной и\u0026nbsp;другой творческой деятельности. По\u0026nbsp;сути, эта метрика показывает долю самой потенциально монетизируемой аудтории и\u0026nbsp;является одним из\u0026nbsp;важнейших показателей успеха артиста преданности его слушателей.\",\"app_instruction_15__text\":\"\u003cspan class='red'\u003eОбратите внимание\u003c/span\u003e на\u0026nbsp;нашу карту-ориентир по\u0026nbsp;суперфанам. Она поможет понять, сколько примерно должно быть суперфанов в\u0026nbsp;процентах от\u0026nbsp;количества ваших слушателей на\u0026nbsp;Яндекс Музыке. Общее правило: чем больше у\u0026nbsp;артиста слушателей, тем выше доля суперфанов.\",\"app_instruction_16__text\":\"Подробнее о\u0026nbsp;суперфанах можете прочитать \u003ca href='{aboutSuperfans}' class='red'\u003eтут\u003c/a\u003e.\",\"app_instruction_17__text\":\"Также в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Портрет аудитории\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете узнать демографию (возраст и\u0026nbsp;пол), а\u0026nbsp;также географию (города и\u0026nbsp;страны, в\u0026nbsp;которых слушают вашу музыку) аудитории. Эти данные представлены в\u0026nbsp;виде отдельных графиков по\u0026nbsp;каждой метрике и\u0026nbsp;позволяют лучше узнать аудиторию слушателей в\u0026nbsp;Яндекс Музыке, чтобы эффективнее планировать продвижение и\u0026nbsp;выступления.\",\"app_instruction_18__text\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e вы\u0026nbsp;можете вывести статистику отдельно по\u0026nbsp;слушателям и\u0026nbsp;отдельно по\u0026nbsp;суперфанам. Для этого кликните на\u0026nbsp;соответствующую кнопку сверху от\u0026nbsp;графиков.\",\"app_instruction_19__text\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e\",\"the_list_4__list__item_1__text\":\"Информация в\u0026nbsp;разделе аналитики со\u0026nbsp;статистикой из\u0026nbsp;Яндекс Музыки обновляется раз в\u0026nbsp;сутки. После\u0026nbsp;20:00 по\u0026nbsp;Москве вы\u0026nbsp;получаете данные за\u0026nbsp;предыдущий день и\u0026nbsp;можете посмотреть их\u0026nbsp;в\u0026nbsp;нужном вам промежутке: за\u0026nbsp;день, неделю, 28\u0026nbsp;дней или год.\",\"the_list_4__list__item_2__text\":\"Раздел работает в\u0026nbsp;режиме бета-тестирования. Если вы\u0026nbsp;захотите сообщить нам об\u0026nbsp;ошибке или поделиться обратной связью, пишите в\u0026nbsp;службу поддержки BandLink \u003ca href='{feedbackForm}' class='red'\u003eчерез форму на\u0026nbsp;сайте\u003c/a\u003e или на\u0026nbsp;почту \u003ca href='{feedbackLink}' class='red'\u003esupport@band.link\u003c/a\u003e. Для вашего удобства прямо в\u0026nbsp;разделе аналитики есть специальная кнопка для связи с\u0026nbsp;поддержкой\u0026nbsp;\u0026mdash; она находится в\u0026nbsp;правом верхнем углу.\",\"the_list_4__list__item_3__text\":\"Раздел работает только в\u0026nbsp;русскоязычном интерфейсе, поэтому он\u0026nbsp;недоступен при включённом VPN.\",\"app_video_block__title\":\"BandLink Аналитика. Обзор блока \u0026quot;Новый релиз\u0026quot; / Опыт Артёма Захарова\"},\"info_help_pages_artist\":{\"the_promo__title\":\"Страница артиста\",\"the_promo__subtitle\":\"Для артистов и\u0026nbsp;их\u0026nbsp;менеджеров\",\"the_promo__main_button_conf__text\":\"Создать страницу\",\"the_promo__footer_title\":\"У\u0026nbsp;вас нет своего сайта?\",\"the_promo__footer_subtitle\":\"Создайте страницу артиста и\u0026nbsp;соберите на\u0026nbsp;ней все важные ссылки на\u0026nbsp;вашу музыку, новости, расписание концертов, мерч и\u0026nbsp;многое другое. \u003cbr /\u003e\u003cbr /\u003eЭто бесплатная и\u0026nbsp;удобная замена сайта: создаётся за\u0026nbsp;несколько минут, сама обновляется и\u0026nbsp;не\u0026nbsp;требует команды программистов и\u0026nbsp;дизайнеров.\",\"the_title__title\":\"Вы\u0026nbsp;можете создать любое количество страниц под любые ваши задачи\",\"the_title__description\":\"Поскольку BandLink полностью бесплатный сервис: все его функции доступны всем пользователям без ограничений\",\"the_title__title_2\":\"Для создания страницы артиста:\",\"app_instruction__title_1\":\"Войдите в личный кабинет BandLink\",\"app_instruction__title_2\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Создать BandLink\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_3\":\"В\u0026nbsp;открывшемся окне выберите \u003cspan class='red'\u003e\u0026laquo;Сайты\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_4\":\"Далее \u003cspan class='red'\u003e\u0026laquo;Артист\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_5\":\"В\u0026nbsp;следующем окне выберите имя артиста/проекта, для которого хотите создать смартлинк.\u003c/span\u003e\",\"app_instruction__title_6\":\"Модуль \u0026laquo;Основные настройки\u0026raquo; открывается \u003cbr class='desktop' /\u003e автоматически при создании страницы BandLink.\",\"app_instruction__text_6\":\"Он\u0026nbsp;позволяет настроить основные параметры отображения смартлинка.\",\"app_instruction__title_7\":\"Заполните модуль \u0026laquo;Основные настройки\u0026raquo; страницы артиста.\",\"the_list__text_1\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Отображаемое имя артиста\u0026raquo;\u003c/span\u003e заполнится автоматически при создании страницы BandLink\u0026nbsp;\u0026mdash; в\u0026nbsp;него впишется имя пользователя сервиса. При необходимости его можно изменить вручную.\",\"the_list__text_2\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e отображаемое имя артиста вы\u0026nbsp;сможете увидеть на\u0026nbsp;превью страницы только после добавления обложки страницы.\",\"the_list__text_3\":\"В\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Обложка мобильной версии\u0026raquo;\u003c/span\u003e загрузите изображение с\u0026nbsp;вашего устройства (минимальное разрешение: 500\u0026times;500px; размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG, PNG). Обложку десктопной версии можно загрузить в\u0026nbsp;модуле настроек \u003ca href='{pageDesign}' target='_blank' class='red'\u003e\u0026laquo;Дизайн страницы\u0026raquo;\u003c/a\u003e.\",\"the_list__text_4\":\"\u003cspan class='red'\u003e\u0026laquo;Тема оформления\u0026raquo;\u003c/span\u003e меняет основные цвета оформления вашей страницы и\u0026nbsp;шрифта. В\u0026nbsp;выпадающем меню выберите желаемый вариант: его вы\u0026nbsp;сможете оценить на\u0026nbsp;превью страницы справа от\u0026nbsp;окна настроек.\",\"the_list__text_5\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Показывать предпросмотр из\u0026nbsp;iTunes\u0026raquo;\u003c/span\u003e добавляет к\u0026nbsp;смартлинку плеер из\u0026nbsp;iTunes. Для этого укажите ссылку на\u0026nbsp;вашу музыку в\u0026nbsp;iTunes в\u0026nbsp;модуле настроек \u003ca target='_blank' href='{musicSettings}' class='red'\u003e\u0026laquo;Музыка\u0026raquo;\u003c/a\u003e. Так слушатели смогут познакомиться с\u0026nbsp;вашими релизами прямо на\u0026nbsp;странице артиста, не\u0026nbsp;переходя на\u0026nbsp;стриминги.\",\"app_instruction__title_8\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"info_help_pages_builder\":{\"the_promo__title\":\"Конструктор страниц\",\"the_promo__subtitle\":\"Для всех пользователей\u003cbr /\u003e и\u0026nbsp;любых задач\",\"the_promo__main_button_conf__text\":\"Создать страницу\",\"the_promo__footer_title\":\"Вам нужен кастомный смартлинк?\",\"the_promo__footer_subtitle\":\"Соберите на\u0026nbsp;одной странице всё, чем хотите поделиться с\u0026nbsp;аудиторией. Например, своим плейлистом сразу на\u0026nbsp;нескольких стриминговых площадках. Оформление и\u0026nbsp;содержание смартлинка вы\u0026nbsp;полностью определяете сами.\",\"app_title__title\":\"Вы\u0026nbsp;можете создать любое количество страниц под любые ваши задачи\",\"app_title__description\":\"Поскольку BandLink полностью бесплатный сервис: все его функции доступны всем пользователям без ограничений\",\"app_title__title_2\":\"Для создания страницы конструктора:\",\"app_instruction__text\":\"Войдите в\u0026nbsp;личный кабинет BandLink\",\"app_instruction__text_2\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Создать BandLink\u0026raquo;\u003c/span\u003e\",\"app_instruction__text_3\":\"В\u0026nbsp;открывшемся окне выберите \u003cspan class='red'\u003e\u0026laquo;Страницы\u0026raquo;\u003c/span\u003e\",\"app_instruction__text_4\":\"Далее\u0026nbsp;\u0026mdash; \u003cspan class='red'\u003e\u0026laquo;Конструктор\u0026raquo;\u003c/span\u003e\",\"app_instruction__text_5\":\"В\u0026nbsp;следующем окне выберите имя артиста/проекта, для которого хотите создать смартлинк.\u003c/span\u003e\",\"app_instruction__text_6\":\"Модуль \u0026laquo;Основные настройки\u0026raquo; открывается автоматически при создании страницы BandLink\",\"app_instruction__text_7\":\"Он\u0026nbsp;позволяет настроить основные параметры отображения страницы конструктора: изменить фон страницы, тему оформления страницы и\u0026nbsp;её\u0026nbsp;имя.\",\"app_instruction__text_8\":\"Заполните модуль \u0026laquo;Основные настройки\u0026raquo; страницы конструктора.\",\"the_list__text\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Фон страницы\u0026raquo;\u003c/span\u003e загрузите изображение с\u0026nbsp;вашего устройства (разрешение: 1400\u0026times;800px; размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG, PNG).\",\"the_list__text_2\":\"Также вы\u0026nbsp;можете просто задать желаемый \u003cspan class='red'\u003e\u0026laquo;Цвет фона\u0026raquo;\u003c/span\u003e страницы, выбрав его в\u0026nbsp;палитре или задав его код.\",\"the_list__text_3\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Включить тёмную тему оформления\u0026raquo;\u003c/span\u003e меняет основные цвета оформления страницы и\u0026nbsp;шрифта: желаемый вариант вы\u0026nbsp;можете оценить на\u0026nbsp;превью страницы справа от\u0026nbsp;окна настроек.\",\"the_list__text_4\":\"Раздел \u003cspan class='red'\u003e\u0026laquo;Домен ссылки\u0026raquo;\u003c/span\u003e позволяет выбрать один из\u0026nbsp;четырёх основных доменов ссылки, а\u0026nbsp;также задать ей\u0026nbsp;уникальное имя в\u0026nbsp;соответствующем поле (используйте латиницу).\",\"the_list__text_5\":\"Также вы\u0026nbsp;можете просто скопировать готовое имя ссылки, рандомно сгенерированное сервисом, нажав на\u0026nbsp;кнопку справа от\u0026nbsp;ссылки.\",\"the_list__text_6\":\"Здесь\u0026nbsp;же вы\u0026nbsp;можете выбрать уникальные домен и\u0026nbsp;поддомен для вашей ссылки. Для этого заранее запросите подключение ваших доменов и\u0026nbsp;поддоменов, перейдя в\u0026nbsp;раздел \u003cspan class='red'\u003e\u0026laquo;Настройки\u0026raquo;\u003c/span\u003e в\u0026nbsp;личном кабинете BandLink.\",\"the_list__text_7\":\"Подробнее о\u0026nbsp;том, как это сделать, читайте \u003ca href='/' target='_blank' class='red'\u003eтут\u003c/a\u003e.\",\"app_instruction__text_9\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически.\",\"app_instruction__text_10\":\"Отличие страницы конструктора от\u0026nbsp;других страниц BandLink в\u0026nbsp;том, что вы\u0026nbsp;сами собираете её\u0026nbsp;под свои задачи.\",\"the_list__text_8\":\"Для этого используйте кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить блок\u0026raquo;\u003c/span\u003e в\u0026nbsp;специальном поле настроек страницы справа от\u0026nbsp;окна основных настроек.\",\"the_list__text_9\":\"Блок \u003cspan class='red'\u003e\u0026laquo;Кнопка\u0026raquo;\u003c/span\u003e позволяет добавить ссылки на\u0026nbsp;любые сторонние сайты, которые не\u0026nbsp;относятся к\u0026nbsp;официальным ресурсам.\",\"the_list__text_10\":\"Здесь вы\u0026nbsp;также можете выбрать иконку для отображения кнопки, её\u0026nbsp;название, задать текст кнопки и\u0026nbsp;изменить цветовое оформление иконки, названия и\u0026nbsp;фона.\",\"the_list__text_11\":\"С\u0026nbsp;помощью кнопок-ползунков отключить отображение иконки, кнопки или всего блока.\",\"the_list__text_12\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Удалить блок\u0026raquo;\u003c/span\u003e удаляет данный блок с\u0026nbsp;вашего смартлинка.\",\"the_list__text_13\":\"\u003cspan class='red'\u003e\u0026laquo;Текстовый блок\u0026raquo;\u003c/span\u003e позволяет добавить любой текст к\u0026nbsp;вашей странице конструктора. С\u0026nbsp;помощью встроенного редактора форматируйте текст и\u0026nbsp;измените цвет фона для этого блока смартлинка, выбрав его в\u0026nbsp;палитре или задав его код.\",\"the_list__text_14\":\"С\u0026nbsp;помощью кнопки-ползунка вы\u0026nbsp;можете отключить отображение блока.\",\"the_list__text_15\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Удалить блок\u0026raquo;\u003c/span\u003e удаляет данный блок с\u0026nbsp;вашего смартлинка.\",\"the_list__text_16\":\"Блок \u003cspan class='red'\u003e\u0026laquo;Галерея\u0026raquo;\u003c/span\u003e позволяет добавить до\u0026nbsp;15\u0026nbsp;фотографий к\u0026nbsp;вашей странице конструктора. Вы\u0026nbsp;можете изменить вид отображения фотографий в\u0026nbsp;галерее, выбрав желаемый: сеткой или списком.\",\"the_list__text_17\":\"С\u0026nbsp;помощью кнопки-ползунка вы\u0026nbsp;можете отключить отображение блока.\",\"the_list__text_18\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Удалить блок\u0026raquo;\u003c/span\u003e удаляет данный блок с\u0026nbsp;вашего смартлинка.\",\"the_list__text_19\":\"Блок \u003cspan class='red'\u003e\u0026laquo;Видео\u0026raquo;\u003c/span\u003e позволяет отобразить на\u0026nbsp;вашей странице конструктора один или несколько видеороликов. Вы\u0026nbsp;можете показывать все видео из\u0026nbsp;своего YouTube-канала или добавить отдельные ролики.\",\"the_list__text_20\":\"С\u0026nbsp;помощью кнопки-ползунка вы\u0026nbsp;можете отключить отображение блока.\",\"the_list__text_21\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Удалить блок\u0026raquo;\u003c/span\u003e удаляет данный блок с\u0026nbsp;вашего смартлинка.\",\"the_list__text_22\":\"С\u0026nbsp;помощью блока \u003cspan class='red'\u003e\u0026laquo;QR-код\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете добавить на\u0026nbsp;страницу конструктора уникальный QR-код и\u0026nbsp;скачать его в\u0026nbsp;высоком разрешении для использования офлайн: на\u0026nbsp;печатной продукции, мерче и\u0026nbsp;так далее.\",\"the_list__text_23\":\"С\u0026nbsp;помощью кнопки-ползунка вы\u0026nbsp;можете отключить отображение блока.\",\"the_list__text_24\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Удалить блок\u0026raquo;\u003c/span\u003e удаляет данный блок с\u0026nbsp;вашего смартлинка.\",\"the_list__text_25\":\"Блок \u003cspan class='red'\u003e\u0026laquo;Подписка\u0026raquo;\u003c/span\u003e позволяет собирать базу ваших фанатов для рассылки уведомлений о\u0026nbsp;новых релизах, концертах и\u0026nbsp;т.д.\",\"the_list__text_26\":\"Через этот блок смартлинка ваши поклонники смогут подписаться на\u0026nbsp;вас в\u0026nbsp;Telegram или\u0026nbsp;VK, а\u0026nbsp;также на\u0026nbsp;вашу email-рассылку.\",\"the_list__text_27\":\"Выберите, подписку на\u0026nbsp;какие каналы вы\u0026nbsp;хотите подключить, и\u0026nbsp;активируйте соответствующие кнопки-ползунки.\",\"the_list__text_28\":\"В\u0026nbsp;этом\u0026nbsp;же блоке настроек вы\u0026nbsp;будете видеть количество подписавшихся на\u0026nbsp;вас пользователей и\u0026nbsp;количество кликов по\u0026nbsp;ссылке на\u0026nbsp;Telegram-канал.\",\"the_list__text_29\":\"Здесь\u0026nbsp;же вы\u0026nbsp;сможете отправлять подписчикам адресную рассылку и\u0026nbsp;сообщения. Для этого используйте соответствующие поля в\u0026nbsp;настройках блока \u0026laquo;Подписка\u0026raquo;. Для рассылки достаточно нажать кнопку \u003cspan class='red'\u003e\u0026laquo;Уведомить подписчиков\u0026raquo;\u003c/span\u003e. Чтобы отправить сообщение, введите его текст в\u0026nbsp;соответствующее поле. Не\u0026nbsp;забудьте указать с\u0026nbsp;помощью кнопок-ползунков, какой канал связи с\u0026nbsp;аудиторией вы\u0026nbsp;хотите использовать.\",\"the_list__text_30\":\"С\u0026nbsp;помощью кнопки-ползунка вы\u0026nbsp;можете отключить отображение блока.\",\"the_list__text_31\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Удалить блок\u0026raquo;\u003c/span\u003e удаляет данный блок с\u0026nbsp;вашего смартлинка.\",\"the_list__text_32\":\"Блок \u003cspan class='red'\u003e\u0026laquo;Музыка\u0026raquo;\u003c/span\u003e позволяет добавить автоматическое отображение всех ваших релизов из\u0026nbsp;iTunes или BandLink. Выберите желаемый способ отображения релизов и\u0026nbsp;активируйте соответствующий ползунок.\",\"the_list__text_33\":\"Выбрав отображение релизов из\u0026nbsp;BandLink, укажите тег, который вы\u0026nbsp;использовали для связи релизов в\u0026nbsp;единую дискографию.\",\"the_list__text_34\":\"Выбрав отображение релизов из\u0026nbsp;iTunes, введите ссылку на\u0026nbsp;ваши релизы в\u0026nbsp;iTunes.\",\"the_list__text_35\":\"С\u0026nbsp;помощью кнопки-ползунка вы\u0026nbsp;можете отключить отображение блока.\",\"the_list__text_36\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Удалить блок\u0026raquo;\u003c/span\u003e удаляет данный блок с\u0026nbsp;вашего смартлинка.\",\"the_list__text_37\":\"Блок \u003cspan class='red'\u003e\u0026laquo;Официальные ссылки\u0026raquo;\u003c/span\u003e позволяет добавить к\u0026nbsp;странице конструктора ссылки на\u0026nbsp;ваш сайт или социальные сети. Вы\u0026nbsp;можете указать любое количество ссылок, для этого используйте кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить\u0026raquo;\u003c/span\u003e. Стрелки справа от\u0026nbsp;ссылок помогут задать желаемую последовательность их\u0026nbsp;отображения, нажав на\u0026nbsp;крестик, вы\u0026nbsp;можете удалить соответствующую ссылку.\",\"the_list__text_38\":\"С\u0026nbsp;помощью кнопки-ползунка вы\u0026nbsp;можете отключить отображение блока.\",\"the_list__text_39\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Удалить блок\u0026raquo;\u003c/span\u003e удаляет данный блок с\u0026nbsp;вашего смартлинка.\",\"the_list__text_40\":\"Блок \u003cspan class='red'\u003e\u0026laquo;Гейтинг\u0026raquo;\u003c/span\u003e позволяет отобразить ссылку на\u0026nbsp;дополнительный контент для пользователей, которые подпишутся на\u0026nbsp;ваши социальные сети, email-рассылку, Яндекс Музыку или Spotify.\",\"the_list__text_41\":\"Подробнее о\u0026nbsp;настройке модуля гейтинг читайте \u003ca href='{settingsLink}' target='_blank' class='red'\u003eтут\u003c/a\u003e.\",\"the_list__text_42\":\"С\u0026nbsp;помощью кнопки-ползунка вы\u0026nbsp;можете отключить отображение блока.\",\"the_list__text_43\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Удалить блок\u0026raquo;\u003c/span\u003e удаляет данный блок с\u0026nbsp;вашего смартлинка.\",\"app_instruction__text_11\":\"Вы\u0026nbsp;можете использовать как все блоки настроек страницы конструктора, так и\u0026nbsp;часть из\u0026nbsp;них. Также вы\u0026nbsp;можете менять порядок отображения блоков на\u0026nbsp;странице в\u0026nbsp;зависимости от\u0026nbsp;их\u0026nbsp;важности для посетителей и\u0026nbsp;от\u0026nbsp;ваших целей. Для этого в\u0026nbsp;окне \u0026laquo;Превью страницы\u0026raquo; наведите мышку на\u0026nbsp;соответствующий блок настроек, зажмите появившуюся кнопку с\u0026nbsp;точками и\u0026nbsp;передвиньте блок. Нажав иконку шестерёнки справа от\u0026nbsp;блока, вы\u0026nbsp;откроете окно настроек этого блока.\",\"app_instruction__text_12\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"info_help_pages_club\":{\"the_promo_one_mobile__title\":\"Страница клуба\",\"the_promo_one_mobile__sub_title\":\"Для клубов и\u0026nbsp;промоутеров\",\"the_promo_one_mobile__button_block\":\"Создать страницу\",\"the_promo__footer_title\":\"У\u0026nbsp;вас есть своя музыкальная площадка, но\u0026nbsp;нет сайта?\",\"the_promo__footer_subtitle\":\"Соберите на\u0026nbsp;одной странице все важные ссылки на\u0026nbsp;расписание концертов, покупку билетов и\u0026nbsp;мерча, новости и\u0026nbsp;многое другое. Это бес /span\u003e и\u0026nbsp;\u003cspan class='red'\u003e\u0026laquo;Время концерта\u0026raquo;\u003c/span\u003e.\",\"the_list__text_4\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Мероприятие в\u0026nbsp;Facebook*/VK\u0026raquo;\u003c/span\u003e вставьте ссылку на\u0026nbsp;группу мероприятия в\u0026nbsp;соответствующей соцсети. Там слушатели смогут узнать подробности о\u0026nbsp;готовящемся выступлении и\u0026nbsp;подписаться на\u0026nbsp;группу, чтобы следить за\u0026nbsp;новостями. \u003cbr /\u003e \u003cspan class='concert-page__grey'\u003e*Компания Meta, владеющая Facebook и Instagram, признана в России экстремистской организацией. В связи с этим отображение ссылок на данные сервисы на территории России отключено.\u003c/span\u003e\",\"the_list__text_5\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Обложка мобильной версии\u0026raquo;\u003c/span\u003e загрузите обложку афиши мероприятия с\u0026nbsp;вашего устройства (минимальное разрешение: 500\u0026times;500px; размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG, PNG). Обложку десктопной версии можно загрузить в\u0026nbsp;модуле настроек \u003ca href='{pageDesign}' target='_blank' class='red'\u003e\u0026laquo;Дизайн страницы\u0026raquo;\u003c/a\u003e.\",\"the_list__text_6\":\"\u003cspan class='red'\u003e\u0026laquo;Тема оформления\u0026raquo;\u003c/span\u003e меняет основные цвета оформления вашей страницы и\u0026nbsp;шрифта. В\u0026nbsp;выпадающем меню выберите желаемый вариант: его вы\u0026nbsp;сможете оценить на\u0026nbsp;превью страницы справа от\u0026nbsp;окна настроек.\",\"the_list__text_7\":\"В\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Ссылки на\u0026nbsp;покупку билетов\u0026raquo;\u003c/span\u003e укажите все сайты, на\u0026nbsp;которых можно приобрести билеты на\u0026nbsp;ваш концерт, или вставьте код виджета онлайн-кассы. \u003cbr /\u003e Поддерживаемые виджеты: Radario, TiketsCloud, Ponominalu, YandexAfisha, TimePad. \u003ca href='{feedbackLink}' target=' ойства (минимальное разрешение: 500\u0026times;500px; размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG , PNG). Обложку десктопной версии можно загрузить в\u0026nbsp;модуле настроек \u003ca href='{pageDesign}' target='blank' class='red'\u003e\u0026laquo;Дизайн страницы\u0026raquo;\u003c/a\u003e.\",\"the_list__text_3\":\"\u003cspan class='red'\u003e\u0026laquo;Тема оформления\u0026raquo;\u003c/span\u003e меняет основные цвета оформления вашей страницы и\u0026nbsp;шрифта. В\u0026nbsp;выпадающем меню выберите желаемый вариант: его вы\u0026nbsp;сможете оценить на\u0026nbsp;превью страницы справа от\u0026nbsp;окна настроек.\",\"the_list__text_4\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Показывать предпросмотр из\u0026nbsp;iTunes\u0026raquo;\u003c/span\u003e добавляет к\u0026nbsp;вашему смартлинку плеер из\u0026nbsp;iTunes. Для этого укажите ссылку на\u0026nbsp;музыку в\u0026nbsp;iTunes в\u0026nbsp;модуле настроек \u003ca href='{musicLink}' target='_blank' class='red'\u003e\u0026laquo;Музыка\u0026raquo;\u003c/a\u003e. Так слушатели смогут познакомиться с\u0026nbsp;релизами ваших артистов прямо на\u0026nbsp;странице лейбла, не\u0026nbsp;переходя на\u0026nbsp;стриминги.\",\"app_instruction__title_9\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"info_help_pages_link\":{\"the_promo_one_mobile__title\":\"Короткая ссылка\",\"the_promo_one_mobile__sub_title\":\"Для всех пользователей BandLink\",\"the_promo_one_mobile__button_block\":\"Создать страницу\",\"the_promo__footer_title\":\"Нужно задать длинной нечитаемой ссылке уникальное короткое и\u0026nbsp;понятное имя?\",\"the_promo__footer_subtitle\":\"Используйте сокращатель ссылок BandLink. С\u0026nbsp;ним вы\u0026nbsp;сможете не\u0026nbsp;только задать желаемое имя вашей ссылке, но\u0026nbsp;и\u0026nbsp;настроить SEO-оптимизацию, ретаргетинг и\u0026nbsp;подключить к\u0026nbsp;ссылке сторонние сервисы аналитики для сбора детальной информации об\u0026nbsp;аудитории.\",\"app_title__title\":\"Вы\u0026nbsp;можете создать любое количество страниц под любые ваши задачи\",\"app_title__description\":\"Поскольку BandLink полностью бесплатный сервис: все его функции доступны всем пользователям без ограничений\",\"app_title__title_2\":\"Для создания сокращенной ссылки:\",\"app_instruction__title\":\"Войдите в личный кабинет BandLink\",\"app_instruction__title_2\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Создать BandLink\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_3\":\"В\u0026nbsp;открывшемся окне выберите \u003cspan class='red'\u003e\u0026laquo;Инструменты\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_4\":\"Далее \u003cspan class='red'\u003e\u0026laquo;Короткая ссылка\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_5\":\"В\u0026nbsp;следующем окне выберите имя артиста/проекта, для которого хотите создать смартлинк.\u003c/span\u003e\",\"app_instruction__title_6\":\"Модуль \u0026laquo;Основные настройки\u0026raquo; открывается автоматически при создании страницы BandLink.\",\"app_instruction__title_7\":\"Он\u0026nbsp;позволяет настроить вид короткой ссылки: задать ей\u0026nbsp;уникальное имя, выбрать для нее домен или поддомен.\",\"app_instruction__title_8\":\"Заполните модуль \u0026laquo;Основные настройки\u0026raquo; короткой ссылки.\",\"the_list__text\":\"Вставьте исходную ссылку, которую необходимо изменить, в\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Ссылка для сокращения\u0026raquo;.\u003c/span\u003e\",\"the_list__text_2\":\"Выберете один из\u0026nbsp;четырёх предложенных доменов для вашей ссылки: band.link, bnd.lc, muz.lc или blgr.lc.\",\"the_list__text_3\":\"Далее вы\u0026nbsp;можете использовать имя ссылки, рандомно сгенерированное сервисом, или задать ей\u0026nbsp;уникальное имя. вписав его в\u0026nbsp;соответствующее поле (используйте при этом латиницу).\",\"the_list__text_4\":\"Здесь\u0026nbsp;же вы\u0026nbsp;можете сохранить получившееся имя ссылки, нажав на\u0026nbsp;кнопку справа от\u0026nbsp;неё, для дальнейшего использования, например, распространения или добавления к\u0026nbsp;постам и\u0026nbsp;в\u0026nbsp;био профилей в\u0026nbsp;соцсетях.\",\"the_list__text_5\":\"Также вы\u0026nbsp;можете использовать уникальные домен и\u0026nbsp;поддомен. Для этого заранее запросите подключение ваших доменов и\u0026nbsp;поддоменов, перейдя в\u0026nbsp;раздел \u003cspan class='red'\u003e\u0026laquo;Настройки\u0026raquo;\u003c/span\u003e в\u0026nbsp;личном кабинете BandLink. Подробнее о\u0026nbsp;том, как это сделать, читайте \u003ca href='{settingsLink}' target='_blank' class='red'\u003eтут.\u003c/a\u003e\",\"app_instruction__title_9\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически.\"},\"info_help_pages_playlist\":{\"the_promo_one_mobile__title\":\"Страница плейлиста\",\"the_promo_one_mobile__sub_title\":\"Для артистов и\u0026nbsp;их\u0026nbsp;менеджеров\",\"the_promo_one_mobile__button_block\":\"Создать страницу\",\"the_promo__footer_title\":\"Хотите поделиться своими плейлистами?\",\"the_promo__footer_subtitle\":\"Собирайте все ссылки на\u0026nbsp;них на\u0026nbsp;одной странице. Так вам будет удобно поделиться со\u0026nbsp;слушателями любимыми треками, даже если они находятся на\u0026nbsp;разных стримингах: каждый сможет выбрать подходящий сервис, а\u0026nbsp;вы\u0026nbsp;сможете распространять в\u0026nbsp;соцсетях всего одну ссылку.\",\"app_title__title\":\"Для создания страницы:\",\"app_instruction__title\":\"Войдите в личный кабинет BandLink\",\"app_instruction__title_2\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Создать BandLink\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_3\":\"В\u0026nbsp;открывшемся окне выберите \u003cspan class='red'\u003e\u0026laquo;Страницы\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_4\":\"Далее \u003cspan class='red'\u003e\u0026laquo;Плейлист\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_5\":\"В\u0026nbsp;следующем окне выберите имя артиста/проекта, для которого хотите создать смартлинк.\u003c/span\u003e\",\"app_instruction__title_6\":\"Модуль \u0026laquo;Основные настройки\u0026raquo; открывается автоматически при создании страницы BandLink.\",\"app_instruction__title_7\":\"Он\u0026nbsp;позволяет настроить основные параметры отображения страницы плейлиста и\u0026nbsp;добавить ссылки на\u0026nbsp;музыкальные сервисы.\",\"app_instruction__title_8\":\"Заполните модуль \u0026laquo;Основные настройки\u0026raquo; страницы плейлиста.\",\"app_instruction__title_9\":\"Введите ссылки на\u0026nbsp;релизы, треки или плейлисты. При добавлении ссылки на\u0026nbsp;релиз из\u0026nbsp;iTunes наш сервис автоматически сделает следующие действия:\",\"the_list__text\":\"подтянет обложку плейлиста;\",\"the_list__text_2\":\"укажет название плейлиста;\",\"the_list__text_3\":\"сформирует ссылку на\u0026nbsp;Apple Music;\",\"the_list__text_4\":\"добавит аудиоплеер iTunes с\u0026nbsp;превью плейлиста;\",\"the_list__text_5\":\"проведёт поиск плейлиста на\u0026nbsp;других музыкальных сервисах и\u0026nbsp;добавит ссылки на них.\",\"the_list__text_10\":\"С\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Добавить ссылку\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете добавить больше ссылок на\u0026nbsp;разные музыкальные сервисы, на\u0026nbsp;которых есть ваш плейлист. \u003cbr /\u003e Если ссылка на\u0026nbsp;музыкальный сервис, которым вы\u0026nbsp;часто пользуетесь, не\u0026nbsp;распознается автоматически, напишите нам об\u0026nbsp;этом через \u003ca href='{supportFormLink}' target='_blank' class='red'\u003eформу поддержки\u003c/a\u003e.\",\"the_list__text_11\":\"Наведите мышкой на\u0026nbsp;указанную ссылку\u0026nbsp;\u0026mdash; справа от\u0026nbsp;неё появится иконка шестерёнки. Нажав на\u0026nbsp;неё, вы\u0026nbsp;можете настроить отображение ссылки или удалить\u0026nbsp;её.\",\"the_list__text_12\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Настроить\u0026raquo;\u003c/span\u003e, чтобы изменить параметры отображения ссылки. В\u0026nbsp;открывшемся окне вы\u0026nbsp;можете задать: имя сервиса, текст кнопки, цвет фона, а\u0026nbsp;также выбрать, показывать\u0026nbsp;ли иконку и\u0026nbsp;кнопку. При активации настройки \u003cspan class='red'\u003e\u0026laquo;Прямая ссылка\u0026raquo;\u003c/span\u003e ваша страница плейлиста будет вести не\u0026nbsp;на\u0026nbsp;смартлинк, а\u0026nbsp;на\u0026nbsp;данный стриминговый сервис, на\u0026nbsp;который вы\u0026nbsp;настроили прямую ссылку. \u003cbr /\u003e Вы\u0026nbsp;также можете изменить порядок ссылок, зажав кнопку с\u0026nbsp;точками справа от\u0026nbsp;ссылки и\u0026nbsp;передвинув\u0026nbsp;её.\",\"the_list__text_13\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Сортировать по\u0026nbsp;кликам\u0026raquo;\u003c/span\u003e включает автоматическую сортировку добавленных музыкальных сервисов в\u0026nbsp;зависимости от\u0026nbsp;количества кликов по\u0026nbsp;ним на\u0026nbsp;странице плейлиста.\",\"the_list__text_14\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Создатель\u0026raquo;\u003c/span\u003e заполнится автоматически при создании страницы BandLink\u0026nbsp;\u0026mdash; в\u0026nbsp;него впишется имя пользователя сервиса. При необходимости его можно изменить вручную.\",\"the_list__text_15\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Плейлист\u0026raquo;\u003c/span\u003e впишите название вашего плейлиста, если оно не\u0026nbsp;подтянулось из\u0026nbsp;iTunes или если вы\u0026nbsp;не\u0026nbsp;используете этот сервис.\",\"the_list__text_16\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Обложка мобильной версии\u0026raquo;\u003c/span\u003e загрузите обложку плейлиста с\u0026nbsp;вашего устройства (минимальное разрешение: 500\u0026times;500px; размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG, PNG).\",\"the_list__text_17\":\"\u003cspan class='red'\u003e\u0026laquo;Тема оформления\u0026raquo;\u003c/span\u003e меняет основные цвета оформления вашей страницы и\u0026nbsp;шрифта. В\u0026nbsp;выпадающем меню выберите желаемый вариант: его вы\u0026nbsp;сможете оценить на\u0026nbsp;превью страницы справа от\u0026nbsp;окна настроек.\",\"the_list__text_18\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Включить дискографию\u0026raquo;\u003c/span\u003e автоматически связывает ваши страницы плейлистов с\u0026nbsp;одним тегом в\u0026nbsp;единую дискографию.\",\"the_list__text_19\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Добавьте тег\u0026raquo;\u003c/span\u003e служит для указания тегов, по\u0026nbsp;которым будет автоматически создаваться единая дискография. Это поможет слушателям с\u0026nbsp;помощью стрелок на\u0026nbsp;обложке смартлинка найти все ваши страницы, созданные на\u0026nbsp;BandLink. Просто введите необходимый тег, например, название группы.\",\"app_instruction__title_11\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"info_help_pages_podcast\":{\"the_promo_one_mobile__title\":\"Страница подкаста\",\"the_promo_one_mobile__sub_title\":\"Для подкастеров и\u0026nbsp;их\u0026nbsp;менеджеров\",\"the_promo_one_mobile__button_block\":\"Создать страницу\",\"the_promo__footer_title\":\"У\u0026nbsp;вас вышел новый эпизод подкаста?\",\"the_promo__footer_subtitle\":\"Соберите ссылки на\u0026nbsp;него на\u0026nbsp;всех стримингах на\u0026nbsp;одной странице. Так слушателям будет удобно выбрать подходящий сервис, а\u0026nbsp;вы\u0026nbsp;сможете делиться в\u0026nbsp;соцсетях всего одной ссылкой, собирать прослушивания на\u0026nbsp;всех площадках сразу и\u0026nbsp;увеличивать доходы от\u0026nbsp;них.\",\"app_title__title\":\"Вы\u0026nbsp;можете создать любое количество страниц под любые ваши задачи\",\"app_title__description\":\"Поскольку BandLink полностью бесплатный сервис: все его функции доступны всем пользователям без ограничений\",\"app_video_block__title\":\"BandLink: Чем полезен сервис BandLink для подкастеров // BandLink Podcaster Page\",\"app_title__title_2\":\"Для создания страницы подкаста:\",\"app_instruction__title\":\"Войдите в личный кабинет BandLink\",\"app_instruction__title_2\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Создать BandLink\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_3\":\"В\u0026nbsp;открывшемся окне выберите \u003cspan class='red'\u003e\u0026laquo;Страницы\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_4\":\"Далее\u0026nbsp;\u0026mdash; \u003cspan class='red'\u003e\u0026laquo;Подкаст\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_5\":\"В\u0026nbsp;следующем окне выберите имя артиста/проекта, для которого хотите создать смартлинк.\u003c/span\u003e\",\"app_instruction__title_6\":\"Модуль \u0026laquo;Основные настройки\u0026raquo; открывается автоматически при создании страницы BandLink.\",\"app_instruction__title_7\":\"Он\u0026nbsp;позволяет настроить основные параметры отображения смартлинка.\",\"app_instruction__title_8\":\"Все данные о\u0026nbsp;подкасте вносятся вручную, поэтому будьте внимательны при их\u0026nbsp;заполнении.\",\"app_instruction__title_9\":\"Заполните модуль \u0026laquo;Основные настройки\u0026raquo; страницы подкаста.\",\"the_list__text\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Название подкаста\u0026raquo;\u003c/span\u003e заполнится автоматически при создании страницы BandLink\u0026nbsp;\u0026mdash; в\u0026nbsp;него впишется имя пользователя сервиса. При необходимости его можно изменить вручную, вписав действительное название вашего подкаста.\",\"the_list__text_2\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Название выпуска\u0026raquo;\u003c/span\u003e укажите название вашего эпизода подкаста.\",\"the_list__text_3\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Дата подкаста\u0026raquo;\u003c/span\u003e в\u0026nbsp;выпадающем календаре укажите дату записи или публикации подкаста. Дата учитывается при создании серии подкастов: ваши эпизоды будут показываться от\u0026nbsp;новых к\u0026nbsp;старым. Если дата не\u0026nbsp;указана, будет учитываться время добавления страниц эпизодов подкаста на\u0026nbsp;BandLink.\",\"the_list__text_4\":\"Далее вставьте ссылку или UPC на\u0026nbsp;ваш эпизод на\u0026nbsp;любом из\u0026nbsp;стримингов.\",\"the_list__text_5\":\"С\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Добавить ссылку\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете добавьте больше ссылок на\u0026nbsp;разные сервисы, на\u0026nbsp;которых размещён ваш подкаст.\",\"the_list__text_6\":\"Если ссылка на\u0026nbsp;сервис подкастов, которым вы\u0026nbsp;часто пользуетесь, не\u0026nbsp;распознается автоматически, напишите нам об\u0026nbsp;этом через \u003cspan class='red'\u003eформу поддержки.\u003c/span\u003e\",\"the_list__text_7\":\"Наведите мышкой на\u0026nbsp;указанную ссылку\u0026nbsp;\u0026mdash; справа от\u0026nbsp;неё появится иконка шестерёнки. Нажав на\u0026nbsp;неё, вы\u0026nbsp;можете настроить отображение ссылки или удалить\u0026nbsp;её.\",\"the_list__text_8\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Настроить\u0026raquo;\u003c/span\u003e, чтобы изменить параметры отображения ссылки. В\u0026nbsp;открывшемся окне вы\u0026nbsp;можете задать: имя сервиса, текст кнопки, цвет фона, а\u0026nbsp;также выбрать, показывать\u0026nbsp;ли иконку и\u0026nbsp;кнопку.\",\"the_list__text_9\":\"При активации настройки \u003cspan class='red'\u003e\u0026laquo;Прямая ссылка\u0026raquo;\u003c/span\u003e ваша страница подкаста будет вести не\u0026nbsp;на\u0026nbsp;смартлинк, а\u0026nbsp;на\u0026nbsp;данный стриминговый сервис, на\u0026nbsp;который вы\u0026nbsp;настроили прямую ссылку.\",\"the_list__text_10\":\"Вы\u0026nbsp;также можете изменить порядок сс ения страницы подкастера.\",\"app_instruction__title_8\":\"Заполните модуль \u0026laquo;Основные настройки\u0026raquo; страницы подкастера.\",\"the_list__text\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Отображаемое имя артиста\u0026raquo;\u003c/span\u003e заполнится автоматически при создании страницы BandLink\u0026nbsp;\u0026mdash; в\u0026nbsp;него впишется имя пользователя сервиса. При необходимости его можно изменить вручную.\",\"the_list__text_2\":\"В\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Обложка мобильной версии\u0026raquo;\u003c/span\u003e загрузите обложку подкаста с\u0026nbsp;вашего устройства (минимальное разрешение: 500\u0026times;500px; размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG, PNG). Обложку десктопной версии можно загрузить в\u0026nbsp;модуле настроек \u003ca href='{pageDesign}' target='_blank' class='red'\u003e\u0026laquo;Дизайн страницы\u0026raquo;\u003c/a\u003e.\",\"the_list__text_3\":\"\u003cspan class='red'\u003e\u0026laquo;Тема оформления\u0026raquo;\u003c/span\u003e меняет основные цвета оформления вашей страницы и\u0026nbsp;шрифта. В\u0026nbsp;выпадающем меню выберите желаемый вариант: его вы\u0026nbsp;сможете оценить на\u0026nbsp;превью страницы справа от\u0026nbsp;окна настроек.\",\"app_instruction__title_9\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"info_help_pages_presave\":{\"the_promo_one_mobile__title\":\"Страница пресейва\",\"the_promo_one_mobile__sub_title\":\"Для артистов и\u0026nbsp;их\u0026nbsp;менеджеров\",\"the_promo_one_mobile__button_block\":\"Создать страницу\",\"the_promo__footer_title\":\"Подготовили новый релиз?\",\"the_promo__footer_subtitle\":\"Создайте страницу пресейва\u0026nbsp;\u0026mdash; и\u0026nbsp;ещё до\u0026nbsp;выхода музыки привлеките к\u0026nbsp;ней больше внимания и\u0026nbsp;увеличьте потенциальные прослушивания: так слушатели смогут сохранить ваш релиз в\u0026nbsp;свои коллекции на\u0026nbsp;стримингах ещё до\u0026nbsp;их\u0026nbsp;официального появления на\u0026nbsp;музыкальных площадках.\",\"app_title__title\":\"Вы\u0026nbsp;можете создать любое количество страниц под любые ваши задачи\",\"app_title__description\":\"Поскольку BandLink полностью бесплатный сервис: все его функции доступны всем пользователям без ограничений\",\"app_title__title_2\":\"Для создания страницы пресейва:\",\"app_instruction__title\":\"Войдите в\u0026nbsp;личный кабинет BandLink\",\"app_instruction__title_2\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Создать BandLink\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_3\":\"В\u0026nbsp;открывшемся окне выберите \u003cspan class='red'\u003e\u0026laquo;Страницы\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_4\":\"Далее \u003cspan class='red'\u003e\u0026laquo;Релиз\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_5\":\"В\u0026nbsp;следующем окне выберите имя артиста/проекта, для которого хотите создать смартлинк.\u003c/span\u003e\",\"app_instruction__title_6\":\"В\u0026nbsp;открывшемся меню настроек нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить пресейв\u0026raquo;\u003c/span\u003e\u0026nbsp;\u0026mdash; так вы\u0026nbsp;автоматически попадёте в\u0026nbsp;модуль \u003cspan class='red'\u003e\u0026laquo;Пресейвы\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_7\":\"Модуль \u0026laquo;Пресейвы\u0026raquo; позволяет добавить к\u0026nbsp;вашему смартлинку ссылки на\u0026nbsp;пресейв релиза на\u0026nbsp;четырёх музыкальных площадках: Яндекс Музыке, Spotify, Apple и\u0026nbsp;VK\u0026nbsp;Music.\",\"app_instruction__title_8\":\"Здесь\u0026nbsp;же вы\u0026nbsp;можете скачать электронные адреса тех, кто сделал пресейв вашего релиза до\u0026nbsp;его выхода.\",\"app_instruction__title_9\":\"Для создания страницы пресейва вам потребуется UPC-код релиза.\",\"app_instruction__title_10\":\"Чтобы его получить:\",\"the_list__text\":\"заранее отгрузите релиз дистрибьютору\",\"the_list__text_2\":\"установите дату релиза через одну-две недели после выгрузки на\u0026nbsp;стримниги\",\"the_list__text_3\":\"запросите UPC-код релиза у\u0026nbsp;своего дистрибьютора\",\"app_instruction__title_11\":\"После этого:\",\"the_list__text_4\":\"в\u0026nbsp;настройках страницы пресейва в\u0026nbsp;выпадающем меню выберите стриминг: Яндекс Музыку, Spotify, Apple Music или VK\u0026nbsp;Music;\",\"the_list__text_5\":\"вставьте UPC-код релиза в\u0026nbsp;соответствующее поле и\u0026nbsp;нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Сохранить\u0026raquo;\u003c/span\u003e;\",\"the_list__text_6\":\"если вы\u0026nbsp;отгрузили музыку на\u0026nbsp;все четыре стриминга, создайте пресейв на\u0026nbsp;каждом из\u0026nbsp;них с\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Добавить пресейв\u0026raquo;\u003c/span\u003e. Так слушатели смогут выбрать удобную для них площадку, чтобы сохранить музыку в\u0026nbsp;свою коллекцию. Чем больше сервисов вы\u0026nbsp;используете, тем больше пресейвов сможете собрать.\",\"app_instruction__title_12\":\"Чтобы отрисовать выпадашку на\u0026nbsp;пресейв:\",\"the_list__text_7\":\"Наведите на\u0026nbsp;ссылку мышку\u0026nbsp;\u0026mdash; справа появится \u003cspan class='red'\u003eзначок шестерёнки\u003c/span\u003e, нажмите на\u0026nbsp;него и\u0026nbsp;выберите \u003cspan class='red'\u003e\u0026laquo;Изменить\u0026raquo;\u003c/span\u003e.\",\"app_instruction__title_13\":\"В\u0026nbsp;открывшемся меню вы\u0026nbsp;можете изменить:\",\"the_list__text_8\":\"выбрать, показывать или нет иконку, передвинув кнопку-ползунок;\",\"the_list__text_9\":\"задать имя сервиса;\",\"the_list__text_10\":\"изменить текст кнопки (по\u0026nbsp;умолчанию написано \u0026laquo;Пресейв\u0026raquo;);\",\"the_list__text_11\":\"выбрать, показывать кнопку или нет (при этом всё поле пресейва останется активным)\",\"the_list__text_12\":\"указать ссылку для редиректа: по\u0026nbsp;умолчанию пользователь, сделавший пресейв, возвращается на\u0026nbsp;страницу смартлинка. Обязательно настройте редирект и\u0026nbsp;перенаправьте его на\u0026nbsp;другую страницу, например, на\u0026nbsp;карточку артиста в\u0026nbsp;стриминге, где можно сразу послушать уже выложенную там музыку,\u0026nbsp;\u0026mdash; это позволит сделать страницу пресейва ещё полезнее и\u0026nbsp;функциональнее;\",\"the_list__text_13\":\"цвет фона поля с\u0026nbsp;пресейвом: для этого выберите его в\u0026nbsp;выпадающей палитре или задайте код цвета.\",\"the_list__text_14\":\"При активации настройки \u003cspan class='red'\u003e\u0026laquo;Прямая ссылка\u0026raquo;\u003c/span\u003e ваша страница пресейва будет вести не\u0026nbsp;на\u0026nbsp;смартлинк, а\u0026nbsp;на\u0026nbsp;данный стриминговый сервис, на\u0026nbsp;который вы\u0026nbsp;настроили прямую ссылку.\",\"the_list__text_15\":\"После изменений нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Сохранить\u0026raquo;\u003c/span\u003e.\",\"the_list__text_16\":\"Нажав на\u0026nbsp;шестерёнку справа от\u0026nbsp;ссылки на\u0026nbsp;пресейв, вы\u0026nbsp;можете удалить\u0026nbsp;её. Для этого выберите \u003cspan class='red'\u003e\u0026laquo;Удалить\u0026raquo;\u003c/span\u003e.\",\"the_list__text_17\":\"Также в\u0026nbsp;модуле настроек \u003cspan class='red'\u003e\u0026laquo;Пресейвы\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете увидеть, сколько слушателей сделали пресейв вашего релиза, и\u0026nbsp;\u003cspan class='red'\u003eскачать отчёт\u003c/span\u003e, в\u0026nbsp;котором будут указаны электронные адреса этих пользователей. Их\u0026nbsp;вы\u0026nbsp;сможете использовать для email-рассылок, уведомлений о\u0026nbsp;новых релизах и\u0026nbsp;концертах, а\u0026nbsp;также, чтобы отправить слушателю подарок в\u0026nbsp;качестве благодарности за\u0026nbsp;пресейв.\",\"the_list__text_18\":\"Подробнее о\u0026nbsp;пресейвах и\u0026nbsp;их\u0026nbsp;использовании читайте в\u0026nbsp; \u003ca target='_blank' href='{presaveInstruction}' class='red'\u003eинструкции\u003c/a\u003e.\",\"app_instruction__title_14\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"info_help_pages_release\":{\"the_promo_one_mobile__title\":\"Страница релиза\",\"the_promo_one_mobile__sub_title\":\"Для артистов и\u0026nbsp;их\u0026nbsp;менеджеров\",\"the_promo_one_mobile__button_block\":\"Создать страницу\",\"app_title__title\":\"У\u0026nbsp;вас вышел новый релиз?\",\"app_title__description\":\"Соберите ссылки на\u0026nbsp;него на\u0026nbsp;всех стримингах на\u0026nbsp;одной странице. Так слушателям будет удобно выбрать подходящий сервис, а\u0026nbsp;вы\u0026nbsp;сможете делиться в\u0026nbsp;соцсетях всего одной ссылкой, собирать стримы на\u0026nbsp;всех площадках сразу и\u0026nbsp;увеличивать прослушивания и\u0026nbsp;доходы от\u0026nbsp;них.\",\"app_title__title_2\":\"Вы\u0026nbsp;можете создать любое количество страниц под любые ваши задачи\",\"app_title__description_2\":\"Поскольку BandLink полностью бесплатный сервис: все его функции доступны всем пользователям без ограничений\",\"app_video_block__title\":\"Для чего нужна Страница Релиза // BandLink Ralease Page\",\"app_title__title_3\":\"Для создания страницы релиза:\",\"app_instruction__title\":\"Войдите в\u0026nbsp;личный кабинет BandLink\",\"app_instruction__title_2\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Создать BandLink\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_3\":\"В\u0026nbsp;открывшемся окне выберите \u003cspan class='red'\u003e\u0026laquo;Страницы\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_4\":\"Далее \u003cspan class='red'\u003e\u0026laquo;Релиз\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_5\":\"В\u0026nbsp;следующем окне выберите имя артиста/проекта, для которого хотите создать смартлинк.\u003c/span\u003e\",\"app_instruction__title_6\":\"Модуль \u0026laquo;Основные настройки\u0026raquo; открывается автоматически при создании страницы BandLink.\",\"app_instruction__title_7\":\"Он\u0026nbsp;содержит основные настройки страницы релиза и\u0026nbsp;позволяет изменить параметры её\u0026nbsp;отображения, добавить ссылки на\u0026nbsp;музыкальные сервисы и\u0026nbsp;связать ваши релизы в\u0026nbsp;единую дискографию на\u0026nbsp;BandLink.\",\"app_instruction__title_8\":\"Заполните модуль \u0026laquo;Основные настройки\u0026raquo; страницы релиза.\",\"the_list__text_title\":\"Введите ссылки на\u0026nbsp;релизы или коды UPC.\",\"app_instruction__title_9\":\"При добавлении ссылки на\u0026nbsp;релиз из\u0026nbsp;iTunes наш сервис автоматически сделает следующие действия:\",\"the_list__text\":\"подтянет обложку релиза;\",\"the_list__text_2\":\"укажет название релиза;\",\"the_list__text_3\":\"сформирует ссылку на\u0026nbsp;Apple Music;\",\"the_list__text_4\":\"добавит аудиоплеер iTunes с\u0026nbsp;превью релиза;\",\"the_list__text_5\":\"проведёт поиск релиза на\u0026nbsp;других музыкальных сервисах и\u0026nbsp;добавит ссылки на\u0026nbsp;них.\",\"app_instruction__title_10\":\"При добавлении UPC кода, который выдаётся при дистрибьюции, наш сервис автоматически сделает следующие действия:\",\"the_list__text_6\":\"подтянет обложку релиза;\",\"the_list__text_7\":\"укажет название релиза;\",\"the_list__text_8\":\"включит аудиоплеер iTunes с\u0026nbsp;превью релиза.\",\"the_list__text_9\":\"проведёт поиск релиза на\u0026nbsp;других музыкальных сервисах;\",\"the_list__text_10\":\"С\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Добавить ссылку\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете добавить больше ссылок на\u0026nbsp;разные музыкальные сервисы, на\u0026nbsp;которых есть ваш плейлист. Если ссылка на\u0026nbsp;музыкальный сервис, которым вы\u0026nbsp;часто пользуетесь, не\u0026nbsp;распознается автоматически, напишите нам об\u0026nbsp;этом через \u003ca href='{feedbackForm}' target='_blank' class='red'\u003eформу поддержки\u003c/a\u003e.\",\"the_list__text_11\":\"Наведите мышкой на\u0026nbsp;указанную ссылку\u0026nbsp;\u0026mdash; справа от\u0026nbsp;неё появится иконка шестерёнки. Нажав на\u0026nbsp;неё, вы\u0026nbsp;можете настроить отображение ссылки или удалить\u0026nbsp;её.\",\"the_list__text_12\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Настроить\u0026raquo;\u003c/span\u003e, чтобы изменить параметры отображения ссылки. В\u0026nbsp;открывшемся окне вы\u0026nbsp;можете задать: имя сервиса, текст кнопки, цвет фона, а\u0026nbsp;также выбрать, показывать\u0026nbsp;ли иконку и\u0026nbsp;кнопку. При активации настройки \u003cspan class='red'\u003e\u0026laquo;Прямая ссылка\u0026raquo;\u003c/span\u003e ваша страница релиза будет вести не\u0026nbsp;на\u0026nbsp;смартлинк, а\u0026nbsp;на\u0026nbsp;данный стриминговый сервис, на\u0026nbsp;который вы\u0026nbsp;настроили прямую ссылку.\",\"the_list__text_13\":\"Вы\u0026nbsp;также можете изменить порядок ссылок на\u0026nbsp;релиз, зажав кнопку с\u0026nbsp;точками справа от\u0026nbsp;ссылки и\u0026nbsp;передвинув\u0026nbsp;её.\",\"the_list__text_14\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Сортировать по\u0026nbsp;кликам\u0026raquo;\u003c/span\u003e включает автоматическую сортировку добавленных музыкальных сервисов в\u0026nbsp;зависимости от\u0026nbsp;количества кликов по\u0026nbsp;ним на\u0026nbsp;странице плейлиста.\",\"the_list__text_15\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Отображаемое имя артиста\u0026raquo;\u003c/span\u003e заполнится автоматически при создании страницы BandLink\u0026nbsp;\u0026mdash; в\u0026nbsp;него впишется имя пользователя сервиса. При необходимости его можно изменить вручную.\",\"the_list__text_16\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Релиз\u0026raquo;\u003c/span\u003e впишите название вашего релиза, если оно не\u0026nbsp;подтянулось из\u0026nbsp;iTunes или если вы\u0026nbsp;не\u0026nbsp;используете этот сервис.\",\"the_list__text_17\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Дата релиза\u0026raquo;\u003c/span\u003e не\u0026nbsp;обязательно к\u0026nbsp;заполнению. Информация из\u0026nbsp;него не\u0026nbsp;отображается на\u0026nbsp;вашем смартлинке. Она учитывается при создании дискографии: так ваши релизы будут показываться от\u0026nbsp;новых к\u0026nbsp;старым. Если дата не\u0026nbsp;указана, будет учитываться время добавления страниц релизов на\u0026nbsp;BandLink.\",\"the_list__text_18\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Обложка мобильной версии\u0026raquo;\u003c/span\u003e загрузите обложку релиза с\u0026nbsp;вашего устройства (минимальное разрешение: 500\u0026times;500px; размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG, PNG).\",\"the_list__text_19\":\"\u003cspan class='red'\u003e\u0026laquo;Тема оформления\u0026raquo;\u003c/span\u003e меняет основные цвета оформления вашей страницы и\u0026nbsp;шрифта. В\u0026nbsp;выпадающем меню выберите желаемый вариант: его вы\u0026nbsp;сможете оценить на\u0026nbsp;превью страницы справа от\u0026nbsp;окна настроек.\",\"the_list__text_20\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Показывать предпросмотр из\u0026nbsp;iTunes\u0026raquo;\u003c/span\u003e добавляет к\u0026nbsp;смартлинку плеер из\u0026nbsp;iTunes, если ранее вы\u0026nbsp;указали ссылку на\u0026nbsp;эту площадку. Так слушатели смогут познакомиться с\u0026nbsp;вашей музыкой прямо на\u0026nbsp;странице релиза, не\u0026nbsp;переходя на\u0026nbsp;стриминги.\",\"the_list__text_21\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Включить дискографию\u0026raquo;\u003c/span\u003e автоматически связывает ваши страницы плейлистов с\u0026nbsp;одним тегом в\u0026nbsp;единую дискографию.\",\"the_list__text_22\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Добавьте тег\u0026raquo;\u003c/span\u003e служит для указания тегов, по\u0026nbsp;которым будет автоматически создаваться единая дискография. Это поможет слушателям с\u0026nbsp;помощью стрелок на\u0026nbsp;обложке смартлинка найти все ваши страницы релизов, созданные на\u0026nbsp;BandLink. Теги также используются при добавлении релизов на\u0026nbsp;страницу артиста или лейбла. Просто введите необходимый тег, например, название группы.\",\"the_list__text_23\":\"Используйте кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить пресейв\u0026raquo;\u003c/span\u003e, если ваш релиз ещё не\u0026nbsp;вышел на\u0026nbsp;стримингах, но\u0026nbsp;вы\u0026nbsp;хотите дать фанатам возможность заранее добавить его в\u0026nbsp;свои коллекции на\u0026nbsp;Яндекс Музыке, Spotify, Apple и\u0026nbsp;VK\u0026nbsp;Music. Для этого вам необходимо знать код UPC вашего релиза (вы\u0026nbsp;можете получить его у\u0026nbsp;своего дистрибьютора). Подробнее о\u0026nbsp;создании страницы пресейва читайте \u003ca target='_blank' href='{createPageLink}' class='red'\u003eтут\u003c/a\u003e.\",\"app_instruction__title_11\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"info_help_pages_tour\":{\"the_promo_one_mobile__title\":\"Страница тура\",\"the_promo_one_mobile__sub_title\":\"Для артистов и\u0026nbsp;их\u0026nbsp;менеджеров, лейблов и\u0026nbsp;промоутеров\",\"the_promo_one_mobile__button_block\":\"Создать страницу\",\"the_promo__footer_title\":\"Планируете гастроли?\",\"the_promo__footer_subtitle\":\"Соберите ссылки на\u0026nbsp;все онлайн-кассы на\u0026nbsp;одной странице тура от\u0026nbsp;BandLink. \u003cbr /\u003e\u003cbr /\u003eТак вы\u0026nbsp;сможете продвигать всего одну ссылку со\u0026nbsp;всей важной информацией обо всех концертах, вашим поклонникам будет удобно выбрать, где купить билеты, а\u0026nbsp;вы\u0026nbsp;сможете увеличить их\u0026nbsp;продажи.\",\"app_title__title\":\"Вы\u0026nbsp;можете создать любое количество страниц под любые ваши задачи\",\"app_title__description\":\"Поскольку BandLink полностью бесплатный сервис: все его функции доступны всем пользователям без ограничений\",\"app_title__title_2\":\"Для создания страницы тура:\",\"app_instruction__title\":\"Войдите в\u0026nbsp;личный кабинет BandLink\",\"app_instruction__title_2\":\"Нажмите \u003cspan class='red'\u003e\u0026laquo;Создать BandLink\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_3\":\"В\u0026nbsp;открывшемся окне выберите \u003cspan class='red'\u003e\u0026laquo;Страницы\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_4\":\"Далее\u0026nbsp;\u0026mdash; \u003cspan class='red'\u003e\u0026laquo;Тур\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_5\":\"В\u0026nbsp;следующем окне выберите имя артиста/проекта, для которого хотите создать смартлинк.\u003c/span\u003e\",\"app_instruction__title_6\":\"Модуль \u0026laquo;Основные настройки\u0026raquo; открывается автоматически при создании страницы BandLink.\",\"app_instruction__title_7\":\"Он\u0026nbsp;содержит основные настройки страницы тура и\u0026nbsp;позволяет изменить основные параметры отображения стмартлинка.\",\"app_instruction__title_8\":\"Все данные о\u0026nbsp;вашем туре вносятся вручную, поэтому будьте внимательны при их\u0026nbsp;заполнении.\",\"app_instruction__title_9\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e даты концертов тура и\u0026nbsp;ссылки на\u0026nbsp;покупку билетов заполняются в\u0026nbsp;модуле \u003cspan class='red'\u003e\u0026laquo;Расписание концертов\u0026raquo;\u003c/span\u003e\",\"app_instruction__title_10\":\"Заполните модуль \u0026laquo;Основные настройки\u0026raquo; страницы тура.\",\"the_list__text\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Отображаемое имя артиста\u0026raquo;\u003c/span\u003e заполнится автоматически при создании страницы BandLink\u0026nbsp;\u0026mdash; в\u0026nbsp;него впишется имя пользователя сервиса. При необходимости его можно изменить вручную.\",\"the_list__text_2\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Концерт\u0026raquo;\u003c/span\u003e укажите название вашего тура.\",\"the_list__text_3\":\"В\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Обложка мобильной версии\u0026raquo;\u003c/span\u003e загрузите изображение с\u0026nbsp;вашего устройства (минимальное разрешение: 500\u0026times;500px; размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG, PNG). Обложку десктопной версии можно загрузить в\u0026nbsp;модуле настроек \u003ca href='{pageDesign}' target='_blank' class='red'\u003e\u0026laquo;Дизайн страницы\u0026raquo;\u003c/a\u003e.\",\"the_list__text_4\":\"\u003cspan class='red'\u003e\u0026laquo;Тема оформления\u0026raquo;\u003c/span\u003e меняет основные цвета оформления вашей страницы и\u0026nbsp;шрифта. В\u0026nbsp;выпадающем меню выберите желаемый вариант: его вы\u0026nbsp;сможете оценить на\u0026nbsp;превью страницы справа от\u0026nbsp;окна настроек.\",\"the_list__text_5\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Тег для связи страниц\u0026raquo;\u003c/span\u003e позволяет привязать страницу тура к\u0026nbsp;странице концерта, релиза, артиста или клуба. Просто введите необходимый тег, например, название группы.\u003cbr/\u003eЭто поможет слушателям с\u0026nbsp;помощью стрелок на\u0026nbsp;обложке смартлинка найти все ваши страницы, созданные на\u0026nbsp;BandLink.\",\"app_instruction__title_11\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"info_help_verification\":{\"the_promo_background__title\":\"Верификация \u003cbr /\u003e в\u0026nbsp;BandLink\",\"app_title__title\":\"Верификация в\u0026nbsp;BandLink открывает доступ к\u0026nbsp;таким разделам аналитики, как \u0026laquo;Фанбаза\u0026raquo; и\u0026nbsp;\u0026laquo;Яндекс Музыка\u0026raquo;, а\u0026nbsp;также даёт возможность подключить донаты к\u0026nbsp;странице артиста в\u0026nbsp;Яндекс Музыке\",\"app_title__description\":\"Обратите внимание:\",\"the_list__text\":\"Верификация доступна только в\u0026nbsp;русскоязычной версии сайта.\",\"the_list__text_3\":\"Пройти верификацию могут артисты и\u0026nbsp;их\u0026nbsp;менеджеры.\",\"app_title__title_2\":\"Чтобы пройти проверку:\",\"the_list__text_4\":\"Войдите в\u0026nbsp;личный кабинет BandLink на\u0026nbsp;десктопе и\u0026nbsp;в\u0026nbsp;боковом меню слева нажмите на\u0026nbsp;кнопку \u003cspan class='red'\u003e \u0026laquo;Верификация\u0026raquo; \u003c/span\u003e\",\"the_list__text_5\":\"В\u0026nbsp;открывшемся меню выберите, какого артиста вы\u0026nbsp;хотите верифицировать, если ведёте несколько проектов на\u0026nbsp;BandLink.\",\"the_list__text_6\":\"После этого авторизуйтесь через Яндекс ID\u0026nbsp;или зарегистрируйтесь в\u0026nbsp;Яндексе, если у\u0026nbsp;вас нет аккаунта там.\",\"the_list__text_7\":\"Далее введите реальные имя и\u0026nbsp;фамилию, почту, которая указана у\u0026nbsp;вас на\u0026nbsp;официальной странице артиста или в\u0026nbsp;официальной группе артиста в\u0026nbsp;соцсетях, а\u0026nbsp;также вашу роль (артист или менеджер артиста).\",\"app_title__title_3\":\"На\u0026nbsp;следующем этапе:\",\"the_list__text_8\":\"верифицируйтесь через официальную группу артиста в\u0026nbsp;ВК;\",\"the_list__text_9\":\"укажите официальный сайт (если его нет, то\u0026nbsp;официальную группу в\u0026nbsp;соцсетях), где можно увидеть ранее упомянутую рабочую почту;\",\"the_list__text_10\":\"добавьте UPC-код последнего сольного релиза. Его вы\u0026nbsp;можете узнать у\u0026nbsp;своего дистрибьютора.\",\"the_list__text_11\":\"Сразу после этого вам на\u0026nbsp;почту придёт письмо о\u0026nbsp;том, что заявка принята. Далее дождитесь подтверждения верификации\u0026nbsp;\u0026mdash; она занимает до\u0026nbsp;семи рабочих дней.\",\"the_instruction__title\":\"Все изменения в\u0026nbsp;настройках модуля сохраняются автоматически.\",\"app_title__title_5\":\"Вам могут отказать в\u0026nbsp;верификации по\u0026nbsp;следующим причинам:\",\"the_list__text_12\":\"Если вы\u0026nbsp;подали неправильный UPC-код;\",\"the_list__text_13\":\"Если вы\u0026nbsp;не\u0026nbsp;являетесь админом или редактором официальной страницы артиста в\u0026nbsp;ВК;\",\"the_list__text_14\":\"Если ваша роль на\u0026nbsp;BandLink не\u0026nbsp;артист или менеджер артиста.\",\"the_list__text_15\":\"Если вы\u0026nbsp;представляете на\u0026nbsp;сервисе лейбл, попросите своих артистов самостоятельно пройти верификацию и\u0026nbsp;передать вам логин и\u0026nbsp;пароль от\u0026nbsp;аккаунта на\u0026nbsp;BandLink или предоставлять аналитику из\u0026nbsp;личного кабинета.\",\"app_title__title_6\":\"После подтверждения верификации вам откроется доступ к\u0026nbsp;разделу аналитики со\u0026nbsp;статистикой из\u0026nbsp;Яндекс Музыки. Можете почитать о\u0026nbsp;нём \u003ca href='{analyticsLink}' target='_blank' class='red'\u003eтут\u003c/a\u003e.\",\"app_list__text_16\":\"Также после этого вы\u0026nbsp;сможете отображать на\u0026nbsp;своих страницах BandLink иконку верификации\",\"the_list__text_17\":\"Для этого:\",\"the_list__text_18\":\"Войдите в\u0026nbsp;личный кабинет BandLink;\",\"the_list__text_19\":\"Откройте настройки любого смартлинка (как нового, так и\u0026nbsp;уже созданного): нажмите на\u0026nbsp;три точки справа от\u0026nbsp;страницы BandLink и\u0026nbsp;выберите \u003cspan class='red'\u003e\u0026laquo;Настройки\u0026raquo;\u003c/span\u003e;\",\"the_list__text_20\":\"Перейдите в\u0026nbsp;модуль настроек \u003ca href='{pageDesign}' target='_blank' class='red'\u003e\u0026laquo;Дизайн страницы\u0026raquo;\u003c/a\u003e.\",\"the_list__text_21\":\"Активируйте опцию \u003cspan class='red'\u003e\u0026laquo;Отображать иконку верификации\u0026raquo;\u003c/span\u003e, как показано ниже.\",\"app_title__title_7\":\"После этого на\u0026nbsp;вашей странице
