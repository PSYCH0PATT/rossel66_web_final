BandLink напротив имени артиста появится такая галочка верификации:\"},\"info_help_tools\":{\"the_promo_background__title\":\"BandLink Инструменты\",\"the_promo__description\":\"Из\u0026nbsp;этого раздела вы\u0026nbsp;узнаете, какие \u003cbr /\u003e ещё инструменты предоставляет сервис \u003cbr /\u003e и\u0026nbsp;как ими пользоваться\",\"the_promo__title\":\"BandLink страницы\",\"app_links__text_1\":\"Верификация в\u0026nbsp;BandLink\",\"app_links__text_2\":\"Групповой доступ к аккаунту\",\"app_links__text_3\":\"BandLink Сканер\",\"app_links__text_4\":\"Подключение своего домена\",\"app_links__text_5\":\"Подключение своего поддомена\",\"app_links__text_6\":\"Навигация в\u0026nbsp;разделе Страницы\",\"app_links__text_7\":\"BandLink чарт\",\"app_links__text_8\":\"BandLink поддержка\"},\"info_help_domain\":{\"the_promo_background__title\":\"Подключение своего домена к\u0026nbsp;BandLink\",\"app_title__title\":\"Данный инструмент позволяет подключить до\u0026nbsp;пяти индивидуальных доменов для ваших ссылок, созданных с\u0026nbsp;помощью нашего сервиса.\",\"the_list__text\":\"Для этого войдите в\u0026nbsp;личный кабинет BandLink и\u0026nbsp;в\u0026nbsp;боковом меню слева нажмите на\u0026nbsp;кнопку \u003cspan class='red'\u003e\u0026laquo;Настройки\u0026raquo;\u003c/span\u003e.\",\"the_list__text_2\":\"Автоматически откроется раздел \u003cspan class='red'\u003e\u0026laquo;Домен\u0026raquo;\u003c/span\u003e\u0026nbsp;\u0026mdash; он\u0026nbsp;вам и\u0026nbsp;нужен.\",\"the_list__text_3\":\"В\u0026nbsp;модуле \u003cspan class='red'\u003e\u0026laquo;Корневой домен\u0026raquo;\u003c/span\u003e поле \u003cspan class='red'\u003e\u0026laquo;Электронная почта\u0026raquo;\u003c/span\u003e заполняется автоматически\u0026nbsp;\u0026mdash; в\u0026nbsp;него подтягивается email, на который зарегистрирован ваш аккаунт. А\u0026nbsp;также вы\u0026nbsp;можете ввести email своего веб-мастера.\",\"the_list__text_4\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Домен\u0026raquo;\u003c/span\u003e введите имя домена, например, \u003cspan class='red'\u003ethexx.ru\u003c/span\u003e и\u0026nbsp;нажмите \u003cspan class='red'\u003e\u0026laquo;Добавить\u0026raquo;\u003c/span\u003e.\",\"app_title__description\":\"Обратите внимание:\",\"the_list__text_5\":\"\u0026mdash;\u0026nbsp;при подаче домена указывайте только его название (без http:// или www.) и\u0026nbsp;доменную зону (.ru, .com, и\u0026nbsp;т.п.), например, thexx.ru;\",\"the_list__text_6\":\"\u0026mdash;\u0026nbsp;вы\u0026nbsp;должны владеть указанным доменом и\u0026nbsp;иметь доступ к\u0026nbsp;изменению DNS настроек в\u0026nbsp;кабинете регистратора доменов;\",\"the_list__text_7\":\"\u0026mdash;\u0026nbsp;если на\u0026nbsp;указанном домене находится другой сайт, после его подключения к\u0026nbsp;BandLink, этот сайт перестанет работать.\",\"the_list__text_8\":\"Ваш запрос на\u0026nbsp;подключение домена уйдёт в\u0026nbsp;поддержку BandLink. Рассмотрение обращения может занять до\u0026nbsp;7\u0026nbsp;рабочих дней. Если подключение домена одобрят, на\u0026nbsp;указанную почту придёт письмо с\u0026nbsp;дальнейшими инструкциями.\",\"the_list__text_9\":\"Как только указанный домен начнёт перенаправлять на\u0026nbsp;наш сайт, его можно будет выбирать для ваших ссылок, созданных на\u0026nbsp;BandLink, в\u0026nbsp;модуле настроек \u003cspan class='red'\u003e\u0026laquo;Вид ссылки\u0026raquo;\u003c/span\u003e в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Уникальный домен\u0026raquo;\u003c/span\u003e.\",\"the_list__text_10\":\"Подробнее о\u0026nbsp;настройке данного модуля можете прочитать \u003ca href='{moduleSetupLink}' target='_blank'\u003eтут\u003c/a\u003e.\",\"the_list__text_11\":\"После этого сообщите нам, когда начнёте пользоваться подключённым доменом, чтобы мы\u0026nbsp;добавили https-сертификат (этот процесс также может занять до\u0026nbsp;7\u0026nbsp;рабочих дней).\"},\"info_help_subdomain\":{\"the_promo_background__title\":\"Подключение своего поддомена к\u0026nbsp;BandLink\",\"app_title__title\":\"Данный инструмент позволяет подключить индивидуальные поддомены для ваших ссылок на\u0026nbsp;корневых доменах сервиса: band.link, bnd.lc и\u0026nbsp;muz.lc\",\"the_list__text\":\"Для этого войдите в\u0026nbsp;личный кабинет BandLink и\u0026nbsp;в\u0026nbsp;боковом меню слева нажмите на\u0026nbsp;кнопку \u003cspan class='red'\u003e\u0026laquo;Настройки\u0026raquo;\u003c/span\u003e.\",\"the_list__text_2\":\"Автоматически откроется раздел \u003cspan class='red'\u003e\u0026laquo;Домен\u0026raquo;\u003c/span\u003e\u0026nbsp;\u0026mdash; он\u0026nbsp;вам и\u0026nbsp;нужен.\",\"the_list__text_3\":\"Пролистайте до\u0026nbsp;подраздела \u003cspan class='red'\u003e\u0026laquo;Поддомен BandLink\u0026raquo;\u003c/span\u003e. Поле \u003cspan class='red'\u003e\u0026laquo;Электронная почта\u0026raquo;\u003c/span\u003e заполняется автоматически\u0026nbsp;\u0026mdash; в\u0026nbsp;него подтягивается email, на\u0026nbsp;который зарегистрирован ваш аккаунт.\",\"the_list__text_4\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Поддомен\u0026raquo;\u003c/span\u003e введите имя поддомена и\u0026nbsp;нажмите \u003cspan class='red'\u003e\u0026laquo;Добавить\u0026raquo;\u003c/span\u003e.\",\"app_title__description\":\"Обратите внимание:\",\"the_list__text_5\":\"\u0026mdash;\u0026nbsp;общие термины (такие как music, audio, playlist и\u0026nbsp;т.д.) не\u0026nbsp;принимаются в\u0026nbsp;качестве поддоменов;\",\"the_list__text_6\":\"\u0026mdash;\u0026nbsp;поддомены короче четырёх символом также не\u0026nbsp;принимаются.\",\"the_list__text_7\":\"Ваш запрос на\u0026nbsp;подключение поддомена уйдёт в\u0026nbsp;поддержку BandLink. Рассмотрение обращения может занять до\u0026nbsp;7\u0026nbsp;рабочих дней. На\u0026nbsp;указанную почту придёт письмо с\u0026nbsp;дальнейшими инструкциями.\",\"the_list__text_8\":\"Далее, если подключение поддомена одобрено, его можно будет выбирать для ваших ссылок, созданных на\u0026nbsp;BandLink, в\u0026nbsp;модуле настроек \u003cspan class='red'\u003e\u0026laquo;Вид ссылки\u0026raquo;\u003c/span\u003e в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Уникальный поддомен\u0026raquo;\u003c/span\u003e.\",\"the_list__text_9\":\"Подробнее о\u0026nbsp;настройке данного модуля можете прочитать \u003ca href='{moduleSetupLink}' target='_blank'\u003eтут\u003c/a\u003e.\"},\"info_help_groupaccess\":{\"the_promo_background__title\":\"Групповой доступ к\u0026nbsp;аккаунту BandLink\",\"app_title__title\":\"Данный инструмент поможет вам предоставить доступ к\u0026nbsp;управлению вашим аккаунтом другим пользователям, например, вашему менеджеру, коллеге по\u0026nbsp;проекту или помощнику\",\"the_list__text\":\"Для этого войдите в\u0026nbsp;личный кабинет BandLink и\u0026nbsp;в\u0026nbsp;боковом меню слева нажмите на\u0026nbsp;кнопку \u003cspan class='red'\u003e\u0026laquo;Настройки\u0026raquo;\u003c/span\u003e.\",\"the_list__text_2\":\"Далее выберите раздел \u003cspan class='red'\u003e\u0026laquo;Групповой доступ\u0026raquo;\u003c/span\u003e.\",\"the_list__text_3\":\"В\u0026nbsp;открывшемся меню введите электронную почту пользователя BandLink, которому хотите предоставить доступ к\u0026nbsp;управлению вашими страницами, и\u0026nbsp;нажмите \u003cspan class='red'\u003e\u0026laquo;Пригласить\u0026raquo;\u003c/span\u003e.\",\"the_list__text_4\":\"Ниже появится список пользователей, которым вы\u0026nbsp;предоставили доступ, и\u0026nbsp;их\u0026nbsp;статус. Чтобы исключить аккаунт из\u0026nbsp;группового доступа, нажмите на\u0026nbsp;стрелочку справа от\u0026nbsp;статуса и\u0026nbsp;в\u0026nbsp;открывшемся меню выберите \u003cspan class='red'\u003e\u0026laquo;Удалить\u0026raquo;\u003c/span\u003e.\",\"the_list__text_5\":\"Пользователю, которому вы\u0026nbsp;предоставили доступ к\u0026nbsp;своему аккаунту, на\u0026nbsp;почту придёт письмо от\u0026nbsp;BandLink. После подтверждения приглашения он\u0026nbsp;сразу\u0026nbsp;же получит возможность управления вашими смартлинками: все они отобразятся в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Страницы\u0026raquo;\u003c/span\u003e в\u0026nbsp;личном кабинете сервиса.\",\"app_title__description\":\"Обратите внимание:\",\"the_list__text_6\":\"Вы\u0026nbsp;можете пригласить до\u0026nbsp;10\u0026nbsp;пользователей к\u0026nbsp;совместному управлению вашим аккаунтом.\",\"the_list__text_7\":\"У\u0026nbsp;приглашённого пользователя не\u0026nbsp;должно быть своих созданных страниц на\u0026nbsp;BandLink.\"},\"info_help_navigation\":{\"the_promo_background__title\":\"Навигация \u003cbr /\u003e в\u0026nbsp;разделе Страницы\",\"app_title__title\":\"Данный инструмент позволяет сортировать и\u0026nbsp;группировать ваши страницы BandLink. Это упрощает их\u0026nbsp;поиск и\u0026nbsp;работу с\u0026nbsp;ними.\",\"the_list__text\":\"В\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Страницы\u0026raquo;\u003c/span\u003e в\u0026nbsp;личном кабинете BandLink хранятся все созданные вами смартлинки. Когда их\u0026nbsp;накапливается слишком много, становится сложно искать нужные ссылки. Упростить задачу поможет навигация по\u0026nbsp;разделу.\",\"app_title__title_2\":\"В\u0026nbsp;нём представлено несколько фильтров для сортировки ваших смартлинков:\",\"the_list__list_1\":\"по\u0026nbsp;виду страниц (выберите нужный вид в\u0026nbsp;выпадающем списке)\",\"the_list__list_2\":\"по\u0026nbsp;артистам (выберите или введите имя нужного артиста в\u0026nbsp;выпадающем списке)\",\"the_list__list_3\":\"по\u0026nbsp;алфавиту и\u0026nbsp;по\u0026nbsp;хронологии (выберите нужный фильтр в\u0026nbsp;выпадающем списке)\",\"the_list__text_2\":\"Вы\u0026nbsp;можете использовать как один, так и\u0026nbsp;несколько фильтров одновременно.\",\"the_list__text_3\":\"По\u0026nbsp;определению все созданные страницы BandLink отображаются в\u0026nbsp;разделе в\u0026nbsp;виде списка. Вы\u0026nbsp;можете настроить отображение таблицей. Для этого нажмите на\u0026nbsp;соответствующую иконку слева от\u0026nbsp;кнопки \u003cspan class='red'\u003e\u0026laquo;Создать BandLink\u0026raquo;\u003c/span\u003e.\",\"the_list__text_4\":\"Также вы\u0026nbsp;можете самостоятельно распределить все созданные страницы так, как пожелаете. Для этого перейдите в\u0026nbsp;подраздел \u003cspan class='red'\u003e\u0026laquo;Папки\u0026raquo;\u003c/span\u003e и\u0026nbsp;нажмите \u003cspan class='red'\u003e\u0026laquo;Создать папку\u0026raquo;\u003c/span\u003e.\",\"the_list__text_5\":\"В\u0026nbsp;открывшемся окне задайте название вашей папке, которое поможет вам ориентироваться и\u0026nbsp;находить нужные страницы, и\u0026nbsp;нажмите \u003cspan class='red'\u003e\u0026laquo;Создать папку\u0026raquo;\u003c/span\u003e.\",\"the_list__text_6\":\"Вы\u0026nbsp;можете создать любое количество папок для сортировки смартлинков.\",\"app_title__title_3\":\"Чтобы редактировать созданную папку\",\"the_list__list_4\":\"Наведите на\u0026nbsp;неё мышку\u0026nbsp;\u0026mdash; появятся две активные кнопки: нажмите на\u0026nbsp;\u003cspan class='red'\u003eиконку шестерёнки\u003c/span\u003e для изменения имени папки или на\u0026nbsp;\u003cspan class='red'\u003eиконку корзины\u003c/span\u003e для\u0026nbsp;удаления папки.\",\"the_list__list_5\":\"После этого вернитесь в\u0026nbsp;подраздел \u003cspan class='red'\u003e\u0026laquo;Страницы\u0026raquo;\u003c/span\u003e\u0026nbsp;\u0026mdash; в\u0026nbsp;карточках ваших смартлинков правее от\u0026nbsp;их\u0026nbsp;названия появится кнопка \u003cspan class='red'\u003e\u0026laquo;Без папки\u0026raquo;\u003c/span\u003e. Нажмите на\u0026nbsp;её\u0026nbsp;и\u0026nbsp;в\u0026nbsp;выпадающем списке выберите нужную папку.\",\"the_list__text_7\":\"Теперь вы\u0026nbsp;легко и\u0026nbsp;быстро сможете найти нужную страницу BandLink в\u0026nbsp;подразделе \u003cspan class='red'\u003e\u0026laquo;Папки\u0026raquo;\u003c/span\u003e.\"},\"info_help_chart\":{\"the_promo_background__title\":\"BandLink \u003cbr class='on-mobile'\u003e чарт\",\"app_title__title\":\"Данный инструмент позволяет следить за\u0026nbsp;популярностью ваших страниц BandLink в\u0026nbsp;нашем хит-параде.\",\"the_list__text\":\"Доступ к\u0026nbsp;чарту имеют даже незарегистрированные пользователи сервиса. Ссылка на\u0026nbsp;него расположена в\u0026nbsp;шапке на\u0026nbsp;главной странице сайта.\",\"the_list__text_2\":\"Также перейти в\u0026nbsp;чарт BandLink можно из\u0026nbsp;личного кабинета, нажав на\u0026nbsp;две стрелки в\u0026nbsp;левом нижнем углу рядом с\u0026nbsp;именем пользователя.\",\"the_list__text_3\":\"BandLink чарт показывает топ-100 самых популярных страниц релизов пользователей за\u0026nbsp;\u003cspan class='red'\u003eдень\u003c/span\u003e, \u003cspan class='red'\u003eнеделю\u003c/span\u003e и\u0026nbsp;\u003cspan class='red'\u003eмесяц\u003c/span\u003e. Данные чарта обновляются ежедневно, поэтому всегда отображают актуальную информацию.\",\"the_list__list_1\":\"Под номером позиции в\u0026nbsp;чарте можно увидеть цифру, обозначающую\u0026nbsp;то, \u003cbr class='mobile' /\u003eкак изменилось место релиза в\u0026nbsp;хит-параде: \u0026laquo;+\u0026raquo; означает, что страница поднялась в\u0026nbsp;чарте; \u0026laquo;-\u0026raquo; говорит о\u0026nbsp;том, что страница опустилась в\u0026nbsp;рейтинге; \u003cspan class='red'\u003e\u0026laquo;new\u0026raquo;\u003c/span\u003e\u0026nbsp;\u0026mdash; это новинка хит-парада.\",\"the_list__list_2\":\"С\u0026nbsp;помощью BandLink чарта вы\u0026nbsp;можете следить за\u0026nbsp;музыкальными новинками других пользователей сервиса, а\u0026nbsp;также за\u0026nbsp;своими успехами в\u0026nbsp;нашем хит-параде. Это не\u0026nbsp;только показатель популярности ваших страниц релизов, но\u0026nbsp;и\u0026nbsp;отличный инфоповод: о\u0026nbsp;попадании в\u0026nbsp;хит-парад можно рассказать своим фанатам в\u0026nbsp;соцсетях и\u0026nbsp;дополнительно обратить их\u0026nbsp;внимание на\u0026nbsp;вашу музыку.\",\"the_list__text_4\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e в\u0026nbsp;настройках смартлинка вы\u0026nbsp;можете показать или скрыть ссылку на\u0026nbsp;текущую позицию вашего релиза в\u0026nbsp;чарте. Для этого в\u0026nbsp;модуле настроек \u003cspan class='red'\u003e\u0026laquo;Дизайн страницы\u0026raquo;\u003c/span\u003e активируйте или деактивируйте соответствующий ползунок.\",\"the_list__list_3\":\"При включённом отображении ссылки на\u0026nbsp;чарт позиция в\u0026nbsp;нём будет отмечена на\u0026nbsp;вашем смартлинке под именем артиста и\u0026nbsp;названием релиза, как это показано на\u0026nbsp;примере ниже.\",\"the_list__text_5\":\"При этом отображается позиция только в\u0026nbsp;чарте за\u0026nbsp;текущий день, а\u0026nbsp;не\u0026nbsp;неделю и\u0026nbsp;месяц. \u003cbr class='mobile' /\u003e Так вы\u0026nbsp;сможете ежедневно следить за\u0026nbsp;своим местом в\u0026nbsp;хит-параде прямо со\u0026nbsp;своей страницы \u003cbr class='mobile' /\u003e релиза, а\u0026nbsp;не\u0026nbsp;через раздел сайта \u0026laquo;BandLink чарт\u0026raquo;.\"},\"info_help_scanner\":{\"the_promo_background__title\":\"BandLink \u003cbr class='on-mobile'\u003e Сканер\",\"app_title__title\":\"Данный инструмент поможет вам узнать, в\u0026nbsp;каких редакционных плейлистах на\u0026nbsp;Яндекс Музыке есть ваши треки.\",\"the_list__text\":\"Чтобы воспользоваться BandLink Сканером, войдите в\u0026nbsp;личный кабинет сервиса и\u0026nbsp;в\u0026nbsp;боковом меню слева нажмите на\u0026nbsp;кнопку \u003cspan class='red'\u003e\u0026laquo;Сканер\u0026raquo;\u003c/span\u003e.\",\"the_list__text_2\":\"Такая\u0026nbsp;же кнопка есть и\u0026nbsp;на\u0026nbsp;главной странице сайта, поскольку инструмент доступен всем, даже незарегистрированным пользователям.\",\"the_list__text_3\":\"В\u0026nbsp;открывшемся окне введите имя интересующего вас артиста и/или название трека в\u0026nbsp;строке поиска и\u0026nbsp;нажмите \u003cspan class='red'\u003e\u0026laquo;Enter\u0026raquo;\u003c/span\u003e или на\u0026nbsp;значок лупы.\",\"the_list__text_4\":\"BandLink Сканер покажет все редакционный плейлисты на\u0026nbsp;Яндекс Музыке, в\u0026nbsp;которых прямо сейчас есть искомый артист и/или трек. Данные Сканера обновляются несколько раз в\u0026nbsp;сутки, поэтому всегда показывают актуальную информацию.\",\"app_title__title_2\":\"Чем BandLink Сканер полезен артистам:\",\"the_list__text_5\":\"показывает поддержку вашей музыки на\u0026nbsp;стриминге в\u0026nbsp;режиме реального времени;\",\"the_list__text_6\":\"предоставляет информационные поводы: увидев свой трек в\u0026nbsp;плейлистах Яндекс Музыки, вы\u0026nbsp;можете рассказать об\u0026nbsp;этом своим фанатам;\",\"the_list__text_7\":\"помогает собрать историю успехов ваших релизов для питчинга: расскажите редакторам стриминга, в\u0026nbsp;какие плейлисты вы\u0026nbsp;уже попадали,\u0026nbsp;\u0026mdash; это дополнительный повод обратить на\u0026nbsp;вас внимание и\u0026nbsp;послушать вашу музыку. Кроме того, это поможет редакторам понять, в\u0026nbsp;какие ещё подборки подходит ваше творчество.\",\"the_list__subtitle\":\"Если ваши треки ещё не\u0026nbsp;попадали в\u0026nbsp;плейлисты Яндекс Музыки \u003cbr class='tablet' /\u003e и\u0026nbsp;не\u0026nbsp;находятся Сканером, вы\u0026nbsp;можете:\",\"the_list__text_9\":\"подумать, на\u0026nbsp;чью известную музыку похоже ваше творчество;\",\"the_list__text_10\":\"просканировать эту музыку, а\u0026nbsp;не\u0026nbsp;свои релизы, чтобы узнать, в\u0026nbsp;какие плейлисты она попадает;\",\"the_list__text_11\":\"выбрать наиболее подходящие вам подборки, в\u0026nbsp;которые, как вам кажется, подошла\u0026nbsp;бы ваша музыка;\",\"the_list__text_12\":\"написать об\u0026nbsp;этом редакторам Яндекс Музыки при питчинге нового релиза.\",\"the_list__text_13\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e BandLink Сканер работает в\u0026nbsp;режиме бета-теста. Если обнаружите баги, пишите об\u0026nbsp;этом в\u0026nbsp;\u003ca href='{supportLink}' target='_blank'\u003eподдержку\u003c/a\u003e.\"},\"info_help_support\":{\"the_promo_background__title\":\"BandLink поддержка\",\"app_title__title\":\"Данный инструмент позволяет обратиться в\u0026nbsp;поддержку сервиса в\u0026nbsp;случае возникновения каких‑либо вопросов или проблем.\",\"the_list__text\":\"Для этого кликните на\u0026nbsp;кнопку \u003cspan class='red'\u003e\u0026laquo;Поддержка\u0026raquo;\u003c/span\u003e, которая расположена в\u0026nbsp;нижней части страниц BandLink\",\"the_list__text_2\":\"В\u0026nbsp;открывшемся окне укажите ваше имя и\u0026nbsp;электронную почту, на\u0026nbsp;которую зарегистрирован аккаунт в\u0026nbsp;BandLink.\",\"the_list__text_3\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Тема\u0026raquo;\u003c/span\u003e из\u0026nbsp;выпадающего списка выберите тему обращения.\",\"the_list__text_4\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Сообщение\u0026raquo;\u003c/span\u003e подробно и\u0026nbsp;ясно опишите свой вопрос. Чем точнее вы\u0026nbsp;изложите суть обращения, тем проще специалистам поддержки будет помочь вам.\",\"the_list__text_5\":\"Далее нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Отправить\u0026raquo;\u003c/span\u003e.\",\"the_list__text_6\":\"После рассмотрения вашего обращения ответ поступит на\u0026nbsp;указанную вами почту. Поэтому убедитесь, что сообщения от\u0026nbsp;BandLink не\u0026nbsp;попадают в\u0026nbsp;папку \u003cspan class='red'\u003e\u0026laquo;Спам\u0026raquo;\u003c/span\u003e.\",\"the_list__text_7\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e срок ответа поддержки\u0026nbsp;\u0026mdash; до\u0026nbsp;5\u0026nbsp;рабочих дней.\"},\"scanner_fallback\":{\"artist\":\"У исполнителя нет треков в чартах и плейлистах\",\"track\":\"Трек не входит ни в один плейлист\"},\"home_page\":{\"header__button_1\":\"Войти\",\"header__button_2\":\"Регистрация\",\"main__title\":\"Инструменты для развития вашей\",\"main__title_accent\":\"музыкальной карьеры\",\"main__description\":\"Увеличивайте прослушивания вашей музыки во всех стримингах.\\nПродвижение с BandLink  — это просто, быстро и эффективно.\",\"registration__title\":\"BandLink поможет построить музыкальную карьеру с нуля\\nили усилить вашу популярность в индустрии\",\"registration__button\":\"Регистрация\",\"registration__factoid_1__text\":\"Страниц\",\"registration__factoid_2__unit\":\"млн\",\"registration__factoid_2__text\":\"Посетителей сайта в месяц\",\"registration__factoid_3__text\":\"Артистов\",\"card__button\":\"Подробнее\",\"tools__title\":\"Все необходимые инструменты для продвижения вашей музыки —\",\"tools__title_accent\":\"в личном кабинете BandLink\",\"tools__card_1__title\":\"Аналитика\",\"tools__card_1__description\":\"Следите за ростом своей популярности в одном личном кабинете: статистика по прослушиваниям в Яндекс Музыке, динамика роста фанбазы, портрет аудитории и многое другое\",\"tools__card_2__title\":\"Страницы\",\"tools__card_2__description\":\"Создавайте и продвигайте страницы релизов, пресейвов, концертов и не только, чтобы увеличить прослушивания своей музыки на всех площадках, продажи мерча и билетов на концерты\",\"tools__card_3__title\":\"Продвижение\",\"tools__card_3__description\":\"Отправляйте ключевые треки на питчинг в Яндекс Музыку, находите первых слушателей с помощью Нитро и продвигайте релизы в Импульсе\",\"banner__title\":\"Донаты от фанатов на развитие творчества\",\"banner__description\":\"Подключайте донаты к своей странице в Яндекс Музыке и получайте поддержку от своих слушателей\",\"banner__button\":\"Подключить донаты\",\"pages__title\":\"BandLink Страницы\",\"pages__description\":\"Создавайте страницы для продвижения релизов, концертов, подкастов и любого другого контента по удобным шаблонам и делитесь ими со своей аудиторией\",\"pages__item_1__title\":\"Релиз\",\"pages__item_1__description\":\"Собирайте ссылки на все стриминги на одной странице и увеличивайте прослушивания релизов сразу во всех стримингах\",\"pages__item_2__title\":\"Концерт / тур\",\"pages__item_2__description\":\"Добавляйте информацию о концерте / туре и ссылки на онлайн-кассы для покупки билетов\",\"pages__item_3__title\":\"Пресейв\",\"pages__item_3__description\":\"Продвигайте будущие релизы до их выхода и увеличивайте прослушивания на стримингах в день премьеры\",\"pages__item_4__title\":\"Артист\",\"pages__item_4__description\":\"Объедините ссылки на вашу музыку, концерты, клипы, новости, соцсети и многое другое — на одной странице\",\"pages__item_5__title\":\"Подкаст\",\"pages__item_5__description\":\"Разместите ссылки сразу на все стриминговые площадки, где выходят новые выпуски вашего подкаста\",\"pages__item_6__title\":\"Лейбл\",\"pages__item_6__description\":\"Делитесь списком ваших артистов, контактами для связи, расписанием концертов и последними новостями\",\"pages__item_7__title\":\"Плейлист\",\"pages__item_7__description\":\"Делитесь с подписчиками и друзьями ссылкой на страницу с вашей любимой музыкой в любых музыкальных стримингах\",\"analytics__title\":\"Аналитика\",\"analytics__description\":\"Отслеживайте рост вашей популярности с помощью удобных инструментов BandLink Аналитики\",\"analytics__item_1__title\":\"Статистика в стриминге\",\"analytics__item_1__description\":\"Анализируйте данные по прослушиваниям, слушателям, лайкам своих релизов и следите за ростом суперфанов\",\"analytics__item_2__title\":\"Фанбаза\",\"analytics__item_2__description\":\"Следите за ростом подписчиков на ваших страницах в соцсетях и музыкальных стриминговых сервисах\",\"analytics__item_3__title\":\"Трафик и аудитория\",\"analytics__item_3__description\":\"Отслеживайте посещаемость своих BandLink страниц, чтобы выстраивать эффективные промо-кампании на привлечение аудитории\",\"analytics__item_4__title\":\"Сканер\",\"analytics__item_4__description\":\"Наблюдайте в режиме реального времени за тем, в какие редакционные плейлисты Яндекс Музыки попали ваши треки\",\"analytics__central__description\":\"Статистика из Яндекс Музыки и данные по фанбазе доступны только верифицированным пользователям\",\"promotion__title\":\"Продвижение релизов в Яндекс Музыке\",\"promotion__description\":\"С помощью инструментов продвижения BandLink вы можете найти первых слушателей, расширить свою аудиторию и попасть в редакторские плейлисты Яндекс Музыки\",\"promotion__card_1__title\":\"Питчинг релизов\",\"promotion__card_1__description\":\"Отправляйте новые релизы на питчинг прямо из личного кабинета и получите шанс попасть в редакционные плейлисты и привлечь новых слушателей\",\"promotion__card_2__title\":\"Импульс\",\"promotion__card_2__description\":\"Позволяет запускать платное продвижение новых релизов в Яндекс Музыке и на сайтах партнёров на заинтересованных слушателей и новую аудиторию.\",\"promotion__card_3__title\":\"Технология Нитро\",\"promotion__card_3__description\":\"С помощью Нитро начинающие артисты могут найти первых слушателей и получить дополнительную поддержку от Яндекс Музыки и BandLink\",\"features__description\":\"Изучайте полезные исследования, посещайте образовательные события, следите за новостями из мира музыки и\",\"features__description_accent\":\"рекомендациями по продвижению\",\"features__button\":\"Подробнее\",\"features__item_1__title\":\"СпотЛайт\",\"features__item_1__description\":\"Рассказывайте индустрии о вашем музыкальном промо или получайте грант на поддержку и реализацию идеи рекламной кампании для будущего релиза\",\"features__item_2__title\":\"СаундЧек\",\"features__item_2__description\":\"Регистрируйтесь на образовательные события BandLink СаундЧек, чтобы узнавать о новых способах продвижения, или смотрите записи выступлений в нашем YouTube-канале\",\"features__item_3__title\":\"Блог\",\"features__item_3__description\":\"Будьте в курсе новостей из музыкальной индустрии и читайте статьи про опыт известных артистов, а также полезные подборки, инструкции и гайды\",\"features__item_4__title\":\"BandLink Research\",\"features__item_4__description\":\"Изучайте наши собственные и партнерские исследования, посвященные музыкальной индустрии и факторам роста популярности и доходов артистов\",\"footer__donates_link\":\"Донаты\",\"footer__pitching_link\":\"Питчинг\",\"footer__scanner_link\":\"Сканер\",\"footer__media_link\":\"Медиа\",\"footer__spotlight_link\":\"СпотЛайт\",\"footer__blog_link\":\"Блог\",\"footer__chart_link\":\"Чарт\",\"footer__features_link\":\"Примеры\",\"footer__help_link\":\"Справка\",\"footer__module_link\":\"Модули\",\"footer__about_link\":\"О нас\",\"footer__copyright\":\"ООО «Яндекс Музыка» ©\",\"footer__document_2\":\"Пользовательское соглашение\",\"footer__document_3\":\"Поддержка\",\"footer__document_4\":\"Куки\"},\"modules_navigation\":{\"the_promo_background__title\":\"BandLink Модули\",\"the_promo__description\":\"Из этой статьи вы узнаете, как настраивать все модули страниц BandLink\",\"links__links_type\":\"Вид ссылки\",\"links__news\":\"Лента новостей\",\"links__player\":\"Аудиоплееры\",\"links__subscription\":\"Подписка\",\"links__retargeting\":\"Ретаргетинг\",\"links__campaigns\":\"Кампании\",\"links__photos\":\"Фотогалерея\",\"links__schedule\":\"Расписание концертов\",\"links__artists\":\"Артисты\",\"links__design\":\"Дизайн страницы\",\"links__streams\":\"Стримы\",\"links__video\":\"Видео\",\"links__presave\":\"Пресейвы\",\"links__seo\":\"SEO-оптимизация\",\"links__gating\":\"Гейтинг\",\"links__text\":\"Текстовый блок\",\"links__off_links\":\"Официальные ссылки\",\"links__external_links\":\"Внешние ссылки\",\"links__donation\":\"Сбор средств\",\"links__description\":\"Описание\",\"links__widget\":\"Виджет\",\"links__qr\":\"QR-код\",\"links__contacts\":\"Контакты\",\"links__music\":\"Музыка\",\"links__analytics\":\"Сервисы аналитики\"},\"modules_links_type\":{\"the_promo_background__title\":\"Вид ссылки\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Основные\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет настроить вид ссылки вашего смартлинка. Вы\u0026nbsp;можете задать уникальное имя ссылки, а\u0026nbsp;также выбрать, на\u0026nbsp;каком из\u0026nbsp;доменов или поддоменов её\u0026nbsp;использовать.\",\"the_list__text\":\"В\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Домен ссылки\u0026raquo;\u003c/span\u003e выберите один из\u0026nbsp;четырёх основных доменов для\u0026nbsp;вашей ссылки: band.link, bnd.lc, muz.lc или blgr.lc.\",\"the_list__text_2\":\"Далее вы\u0026nbsp;можете либо использовать сгенерированное сервисом имя, либо\u0026nbsp;задать ссылке своё уникальное имя, вписав его в\u0026nbsp;соответствующее поле (используйте при этом латиницу).\",\"the_list__text_3\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Копировать\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;ссылки позволяет быстро скопировать готовую ссылку в\u0026nbsp;буфер обмена.\",\"the_list__text_4\":\"Здесь\u0026nbsp;же вы\u0026nbsp;можете выбрать свой собственный поддомен на\u0026nbsp;наших доменах и\u0026nbsp;привязать свой собственный домен к\u0026nbsp;нашему сервису. Для этого заранее запросите подключение ваших доменов и\u0026nbsp;поддоменов: перейдите в\u0026nbsp;раздел \u003cspan class='red'\u003e\u0026laquo;Настройки\u0026raquo;\u003c/span\u003e в\u0026nbsp;личном кабинете BandLink и\u0026nbsp;следуйте \u003ca href='{instructionsLink}' target='_blank' class='red'\u003eинструкции.\u003c/a\u003e\",\"the_list__text_5\":\"Учтите: проверка домена может занимать до\u0026nbsp;семи рабочих дней.\",\"the_list__text_6\":\"Все изменения в\u0026nbsp;настройках модуля сохраняются автоматически.\"},\"modules_design\":{\"the_promo_background__title\":\"Дизайн страницы\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет провести дополнительные настройки оформления вашей страницы BandLink и\u0026nbsp;задать порядок отображения видимых модулей.\",\"the_list__text\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Включить десктопную версию\u0026raquo;\u003c/span\u003e адаптирует вид вашей страницы под\u0026nbsp;просмотр с\u0026nbsp;компьютера. Оценить данный способ отображения страницы вы\u0026nbsp;можете с\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек. Нажмите на\u0026nbsp;неё\u0026nbsp;\u0026mdash; откроется ваша страница в\u0026nbsp;том виде, который вы ей настроили.\",\"the_list__text_2\":\"В\u0026nbsp;этом\u0026nbsp;же модуле настроек вы\u0026nbsp;можете изменить \u003cspan class='red'\u003e\u0026laquo;Фон страницы\u0026raquo;\u003c/span\u003e. Для этого загрузите изображение с\u0026nbsp;вашего устройства. Обратите внимание на\u0026nbsp;требования к\u0026nbsp;изображению: разрешение: 1400\u0026times;800px; размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG, PNG.\",\"the_list__text_3\":\"Также вы\u0026nbsp;можете задать желаемый \u003cspan class='red'\u003e\u0026laquo;Цвет фона\u0026raquo;\u003c/span\u003e страницы, выбрав его\u0026nbsp;в\u0026nbsp;выпадающей палитре или указав его код. Для этого кликните на\u0026nbsp;цветную иконку напротив настроек \u0026laquo;Цвет фона\u0026raquo;.\",\"the_list__text_4\":\"Активируйте кнопку-ползунок \u003cspan class='red'\u003e\u0026laquo;Скрыть ссылку на\u0026nbsp;чарт\u0026raquo;\u003c/span\u003e, если хотите скрыть текущую позицию вашего релиза в\u0026nbsp;чарте BandLink.\",\"the_list__text_5\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Отображать иконку верификации\u0026raquo;\u003c/span\u003e добавляет галочку верификации на\u0026nbsp;смартлинке рядом с\u0026nbsp;именем артиста. Чтобы воспользоваться этой опцией, верифицируйтесь в\u0026nbsp;сервисе. Для этого нажмите \u003cspan class='red'\u003e\u0026laquo;Верификация\u0026raquo;\u003c/span\u003e в\u0026nbsp;личном кабинете BandLink (в\u0026nbsp;меню слева) и\u0026nbsp;следуйте \u003ca href='{instructionsLink}' target='_blank' class='red'\u003eинструкции.\u003c/a\u003e\",\"the_list__text_6\":\"В\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Порядок видимых модулей\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете изменить последовательность отображения модулей на\u0026nbsp;своей странице в\u0026nbsp;зависимости от\u0026nbsp;ваших маркетинговых целей и\u0026nbsp;задач: расположите первыми те\u0026nbsp;блоки настроек, к\u0026nbsp;которым хотите привлечь больше внимания пользователей.\",\"the_list__text_7\":\"Создайте желаемую последовательность с\u0026nbsp;помощью специальных кнопок справа от\u0026nbsp;модуля настроек (в\u0026nbsp;виде девяти точек): зажмите кнопку и\u0026nbsp;перемещайте модуль выше или ниже в\u0026nbsp;списке.\",\"the_list__text_8\":\"Список доступных модулей зависит от типа страницы.\",\"the_list__text_9\":\"Все изменения в\u0026nbsp;настройках модуля сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e (справа от\u0026nbsp;окна настроек).\"},\"modules_official_links\":{\"the_promo_background__title\":\"Официальные ссылки\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить ссылки на\u0026nbsp;ваши официальный сайт и\u0026nbsp;страницы в\u0026nbsp;социальных сетях. При заполнении часть ссылок автоматически копируется в\u0026nbsp;модуль \u0026laquo;Лента новостей\u0026raquo; и\u0026nbsp;\u0026laquo;Видео\u0026raquo;.\",\"app_title__title_2\":\"С\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Включить официальные ссылки\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете включить или отключить отображение официальных ссылок на\u0026nbsp;вашей странице BandLink.\",\"the_list__text\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e часть ссылок автоматически подтянется в\u0026nbsp;этот модуль при создании страницы. Проверьте актуальность этих ссылок. В\u0026nbsp;случае необходимости их\u0026nbsp;можно заменить вручную на\u0026nbsp;корректные.\",\"the_list__text_2\":\"К\u0026nbsp;своей странице BandLink вы\u0026nbsp;можете добавить \u003cspan class='red'\u003eссылки на\u0026nbsp;13\u0026nbsp;площадок:\u003c/span\u003e\",\"the_platform_list__text\":\"— Яндекс Музыку\",\"the_platform_list__text_2\":\"— ВКонтаке\",\"the_platform_list__text_3\":\"— Дзен\",\"the_platform_list__text_4\":\"— Telegram\",\"the_platform_list__text_5\":\"— Instagram*\",\"the_platform_list__text_6\":\"— Facebook*\",\"the_platform_list__text_7\":\"— YouTube\",\"the_platform_list__text_8\":\"— TikTok\",\"the_platform_list__text_9\":\"— Twitter\",\"the_platform_list__text_10\":\"— WhatsApp\",\"the_platform_list__text_11\":\"— Viber\",\"the_platform_list__text_12\":\"— Официальный сайт\",\"the_platform_list__disclaimer\":\"* Компания Meta, владеющая Facebook и\u0026nbsp;Instagram, признана в\u0026nbsp;России экстремистской организацией. В\u0026nbsp;связи с\u0026nbsp;этим отображение ссылок на\u0026nbsp;данные сервисы на\u0026nbsp;территории России отключено.\",\"the_list__text_3\":\"Вы\u0026nbsp;можете добавить как все ссылки, так и\u0026nbsp;некоторые из\u0026nbsp;них в\u0026nbsp;зависимости от\u0026nbsp;ваших задач и\u0026nbsp;целей по\u0026nbsp;продвижению этих платформ.\",\"the_list__text_4\":\"Также вы\u0026nbsp;можете изменить последовательность отображения ссылок на\u0026nbsp;вашей странице. Просто расположите их\u0026nbsp;в\u0026nbsp;необходимом порядке с\u0026nbsp;помощью специальных кнопок в\u0026nbsp;виде девяти точек справа от\u0026nbsp;каждой ссылки: зажмите кнопку и\u0026nbsp;перетащите ссылку на\u0026nbsp;нужное место.\",\"the_list__text_5\":\"Все\u0026nbsp;изменения в\u0026nbsp;настройках модуля сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e«Превью страницы»\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_news\":{\"the_promo_background__title\":\"Лента новостей\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет отобразить на\u0026nbsp;вашей странице BandLink ленту новостей, которая будет автоматически обновляться из\u0026nbsp;ваших соцсетей.\",\"the_list__text\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e впишите название для данного модуля смартлинка. Стандартный заголовок\u0026nbsp;\u0026mdash; \u0026laquo;Новости\u0026raquo;. Он\u0026nbsp;отображается, даже если вы\u0026nbsp;не\u0026nbsp;заполните поле. Вы\u0026nbsp;можете придумать оригинальное название, которое привлечёт внимание посетителей странички.\",\"the_list__text_2\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Включить ленту новостей\u0026raquo;\u003c/span\u003e активирует автоматический сбор новых постов из\u0026nbsp;указанных источников. Все посты будут собираться в\u0026nbsp;единой ленте на\u0026nbsp;вашей странице BandLink.\",\"the_list__text_3\":\"В\u0026nbsp;модуле \u003cspan class='red'\u003e\u0026laquo;Лента новостей\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете собирать посты из\u0026nbsp;трёх источников: ВКонтакте, Twitter и\u0026nbsp;YouTube. Просто добавить ссылки на\u0026nbsp;ваши каналы в\u0026nbsp;этих соцсетях.\",\"the_list__text_4\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e данный функционал не\u0026nbsp;работает с\u0026nbsp;личными страницами ВКонтакте\u0026nbsp;\u0026mdash; указывать необходимо ссылку на\u0026nbsp;ваш паблик.\",\"the_list__text_5\":\"С\u0026nbsp;помощью кнопки-ползунка вы\u0026nbsp;можете активировать и\u0026nbsp;деактивировать сбор постов из\u0026nbsp;конкретной соцсети.\",\"the_list__text_6\":\"Все изменения в\u0026nbsp;настройках модуля сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_streams\":{\"the_promo_background__title\":\"Стримы\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить на\u0026nbsp;вашу страничку BandLink информацию о\u0026nbsp;запланированных онлайн-мероприятиях и\u0026nbsp;ссылку на\u0026nbsp;них.\",\"the_list__text\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e впишите название для данного модуля странички. Придумайте цепляющий заголовок и\u0026nbsp;используйте понятный призыв. Например, \u0026laquo;Подключайтесь к\u0026nbsp;нашему стриму\u0026raquo; вместо стандартного \u0026laquo;Стрим\u0026raquo;, который будет использоваться, даже если вы\u0026nbsp;не\u0026nbsp;заполните данное поле.\",\"the_list__text_2\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Описание\u0026raquo;\u003c/span\u003e добавьте всю важную информацию о\u0026nbsp;вашем онлайн-мероприятии: даты, время, тему и\u0026nbsp;так далее.\",\"the_list__text_3\":\"Нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить ссылку\u0026raquo;\u003c/span\u003e, чтобы указать ссылку на\u0026nbsp;ваш стрим. Вы\u0026nbsp;можете добавить несколько ссылок и\u0026nbsp;изменить последовательность их\u0026nbsp;отображения на\u0026nbsp;странице с\u0026nbsp;помощью специальных кнопок в\u0026nbsp;виде девяти точек справа от\u0026nbsp;поля ввода.\",\"the_list__text_4\":\"Если вы\u0026nbsp;наведёте мышку на\u0026nbsp;интересующую вас ссылку, справа от\u0026nbsp;неё\u0026nbsp;появится \u003cspan class='red'\u003eиконка шестерёнки\u003c/span\u003e. Нажмите на\u0026nbsp;неё, чтобы \u003cspan class='red'\u003eудалить\u003c/span\u003e ссылку или \u003cspan class='red'\u003eизменить\u003c/span\u003e\u0026nbsp;её.\",\"the_list__text_5\":\"При нажатии на\u0026nbsp;кнопку \u003cspan class='red'\u003e\u0026laquo;Изменить\u0026raquo;\u003c/span\u003e откроется меню настроек ссылки. Здесь вы\u0026nbsp;можете выбрать иконку для отображения ссылки, задать имя сервиса и\u0026nbsp;текст кнопки с\u0026nbsp;призывом. Не\u0026nbsp;забудьте сохранить изменения.\",\"the_list__text_6\":\"Другие изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_donation\":{\"the_promo_background__title\":\"Сбор средств\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить на\u0026nbsp;вашу страничку BandLink ссылки на\u0026nbsp;популярные сервисы сбора пожертвований. Так ваша аудитория сможет поддержать ваш\u0026nbsp;проект.\",\"the_list__text\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e впишите название для данного модуля странички. Придумайте цепляющий заголовок и\u0026nbsp;используйте понятный призыв. Например, \u0026laquo;Помогите записать новый релиз\u0026raquo; вместо стандартного \u0026laquo;Сбор средств\u0026raquo;, который будет использоваться, даже если вы\u0026nbsp;не\u0026nbsp;заполните данное поле.\",\"the_list__text_2\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Описание\u0026raquo;\u003c/span\u003e добавьте всю важную информацию о\u0026nbsp;вашей кампании по\u0026nbsp;сбору средств: сколько вам нужно денег, на\u0026nbsp;что именно, как это поможет вашему проекту и\u0026nbsp;что получат от\u0026nbsp;вас слушатели в\u0026nbsp;качестве благодарности за\u0026nbsp;помощь.\",\"the_list__text_3\":\"Нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить ссылку\u0026raquo;\u003c/span\u003e, чтобы указать ссылку на\u0026nbsp;платформы краудфандинга. Вы\u0026nbsp;можете добавить несколько ссылок и\u0026nbsp;изменить последовательность их\u0026nbsp;отображения на\u0026nbsp;странице с\u0026nbsp;помощью специальных кнопок в\u0026nbsp;виде девяти точек справа от\u0026nbsp;поля ввода.\",\"the_list__text_4\":\"Если вы\u0026nbsp;наведёте мышку на\u0026nbsp;интересующую вас ссылку, справа от\u0026nbsp;неё\u0026nbsp;появится \u003cspan class='red'\u003eиконка шестерёнки\u003c/span\u003e. Нажмите на\u0026nbsp;неё, чтобы \u003cspan class='red'\u003eудалить\u003c/span\u003e ссылку или \u003cspan class='red'\u003eизменить\u003c/span\u003e\u0026nbsp;её.\",\"the_list__text_5\":\"При нажатии на\u0026nbsp;кнопку \u003cspan class='red'\u003e\u0026laquo;Изменить\u0026raquo;\u003c/span\u003e откроется меню настроек ссылки. Здесь вы\u0026nbsp;можете выбрать иконку для отображения ссылки, задать имя сервиса и\u0026nbsp;текст кнопки с\u0026nbsp;призывом. Не\u0026nbsp;забудьте сохранить изменения.\",\"the_list__text_6\":\"Другие изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_audio_players\":{\"the_promo_background__title\":\"Аудиоплееры\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить к\u0026nbsp;вашей странице BandLink сторонний аудиоплеер для\u0026nbsp;предварительного прослушивания релиза или эпизода подкаста.\",\"the_list__text\":\"Чтобы отобразить сторонний аудиоплеер на\u0026nbsp;своей страничке BandLink, вы\u0026nbsp;можете в\u0026nbsp;соответствующих полях настроек:\",\"the_list__text_2\":\"\u0026mdash;\u0026nbsp;вставьте ссылку на\u0026nbsp;трек или альбом в\u0026nbsp;\u003cspan class='red'\u003eЯндекс Музыке\u003c/span\u003e\",\"the_list__text_3\":\"\u0026mdash;\u0026nbsp;вставьте ссылку на\u0026nbsp;трек в\u0026nbsp;\u003cspan class='red'\u003eSoundCloud\u003c/span\u003e\",\"the_list__text_4\":\"\u0026mdash;\u0026nbsp;или вставить \u003cspan class='red'\u003eкод виджета PromoDJ\u003c/span\u003e\",\"the_list__text_5\":\"Так посетители вашей страницы смогут послушать музыку или подкаст, не\u0026nbsp;переходя на\u0026nbsp;другие ресурсы, прямо на\u0026nbsp;вашем смартлинке. Это особенно полезно для привлечения новой аудитории, ещё не\u0026nbsp;знакомой с\u0026nbsp;вашим творчеством.\",\"the_list__text_6\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Сделать обложкой релиза\u0026raquo;\u003c/span\u003e заменяет обложку релиза на\u0026nbsp;плеер SoundCloud.\",\"the_list__text_7\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_video\":{\"the_promo_background__title\":\"Видео\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет отобразить на\u0026nbsp;вашей страничке BandLink один или несколько видеоклипов из\u0026nbsp;YouTube.\",\"the_list__text\":\"Выберите один из\u0026nbsp;двух способов отображения видеороликов на\u0026nbsp;странице BandLink:\",\"the_list__text_2\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Показывать видео из\u0026nbsp;YouTube канала\u0026raquo;\u003c/span\u003e включает вывод 20\u0026nbsp;последних видеороликов, залитых на\u0026nbsp;указанный вами YouTube канал. Отображение роликов обновляется автоматически. Вам нужно лишь активировать кнопку-ползунок и\u0026nbsp;вставить ссылку на\u0026nbsp;канал.\",\"the_list__text_3\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Показывать видео из\u0026nbsp;списка\u0026raquo;\u003c/span\u003e открывает ручную настройку отображаемых на\u0026nbsp;смартлинке роликов. Так в\u0026nbsp;соответствующих полях вы\u0026nbsp;можете ввести ссылки на\u0026nbsp;отдельные видеоклипы из\u0026nbsp;YouTube. Вы\u0026nbsp;можете добавить несколько ссылок на\u0026nbsp;видео\u0026nbsp;\u0026mdash; для этого нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить видео\u0026raquo;\u003c/span\u003e. Также вы\u0026nbsp;можете изменить последовательность их\u0026nbsp;отображения на\u0026nbsp;странице с\u0026nbsp;помощью специальных кнопок в\u0026nbsp;виде девяти точек справа от\u0026nbsp;поля ввода. Просто зажмите кнопку и\u0026nbsp;перетащите ссылку на\u0026nbsp;нужное место.\",\"the_list__text_4\":\"Чтобы удалить ссылку, наведите на\u0026nbsp;неё мышку\u0026nbsp;\u0026mdash; справа появится \u003cspan class='red'\u003eиконка шестерёнки\u003c/span\u003e. Нажмите на\u0026nbsp;неё, а\u0026nbsp;далее\u0026nbsp;\u0026mdash; \u003cspan class='red'\u003e\u0026laquo;Удалить\u0026raquo;\u003c/span\u003e.\",\"the_list__text_5\":\"В\u0026nbsp;любое время вы\u0026nbsp;можете изменить способ отображения видеороликов на\u0026nbsp;вашей\u0026nbsp;странице: выбирайте тот, который наилучшим и\u0026nbsp;самым эффективным\u0026nbsp;образом поможет донести контент до\u0026nbsp;вашей аудитории.\",\"the_list__text_6\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_description\":{\"the_promo_background__title\":\"Описание\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить к\u0026nbsp;вашей страничке BandLink описание: биографию, информацию о\u0026nbsp;проекте, пресс-релиз, и\u0026nbsp;т.п.\",\"the_list__text\":\"В\u0026nbsp;это модуле вы\u0026nbsp;можете заполнить описание как на\u0026nbsp;русском, так\u0026nbsp;и\u0026nbsp;на\u0026nbsp;английском языке. Если вы\u0026nbsp;добавите описание на\u0026nbsp;двух языках, то\u0026nbsp;версия на\u0026nbsp;русском будет показываться пользователям только с\u0026nbsp;русским языком браузера, а\u0026nbsp;английская версия\u0026nbsp;\u0026mdash; всем остальным.\",\"the_list__text_2\":\"Придумайте и\u0026nbsp;впишите цепляющее название для этого модуля странички в\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e. Он\u0026nbsp;отображается только в\u0026nbsp;десктопной версии.\",\"the_list__text_3\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Короткое описание\u0026raquo;\u003c/span\u003e введите часть описания объёмом до\u0026nbsp;200\u0026nbsp;символов. Она будет отображаться на\u0026nbsp;вашей страничке. Постарайтесь увлечь аудиторию коротким описанием так, чтобы хотелось прочитать весь текст о\u0026nbsp;вас и\u0026nbsp;вашем проекте.\",\"the_list__text_4\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Полное описание\u0026raquo;\u003c/span\u003e введите полную версию текста: она будет разворачиваться по\u0026nbsp;клику. Здесь нет ограничений по\u0026nbsp;количеству символов\u0026nbsp;\u0026mdash; руководствуйтесь удобством пользователей: самостоятельно оцените, текст какого объёма будет комфортно воспринимать на\u0026nbsp;вашем смартлинке.\",\"the_list__text_5\":\"Аналогично заполняются и\u0026nbsp;поля описания на\u0026nbsp;английском языке.\",\"the_list__text_6\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_artists\":{\"the_promo_background__title\":\"Артисты\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить к\u0026nbsp;страничке лейбла на\u0026nbsp;BandLink список ваших артистов, загрузить их\u0026nbsp;фотографию, указать ссылки на\u0026nbsp;соцсети и\u0026nbsp;задать порядок их\u0026nbsp;отображения.\",\"the_list__text\":\"В\u0026nbsp;поле  \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e впишите название данного модуля вашей страницы. Используйте простые, цепляющие и\u0026nbsp;понятные формулировки, чтобы\u0026nbsp;привлечь внимание аудитории.\",\"the_list__text_2\":\"С\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Загрузить картинку\u0026raquo;\u003c/span\u003e загрузите фотографию артиста с\u0026nbsp;вашего устройства (разрешение: 300\u0026times;300px; размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG, PNG)\",\"the_list__text_3\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Имя артиста\u0026raquo;\u003c/span\u003e впишите имя или псевдоним артиста.\",\"the_list__text_4\":\"С\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Добавить ссылку\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете добавить одну или\u0026nbsp;несколько ссылок на\u0026nbsp;соцсети артиста. Нажав на\u0026nbsp;\u003cspan class='red'\u003eиконку урны\u003c/span\u003e справа от\u0026nbsp;ссылки, вы\u0026nbsp;можете удалить\u0026nbsp;её.\",\"the_list__text_5\":\"Нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить артиста\u0026raquo;\u003c/span\u003e, чтобы разместить на\u0026nbsp;странице BandLink больше артистов и\u0026nbsp;информации о\u0026nbsp;них.\",\"the_list__text_6\":\"Используйте специальную кнопку в\u0026nbsp;виде девяти точек в\u0026nbsp;правом верхнем углу карточки артиста, чтобы переместить её\u0026nbsp;и\u0026nbsp;создать желаемую последовательность отображения артистов.\",\"the_list__text_7\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_music\":{\"the_promo_background__title\":\"Музыка\",\"app_title__title\":\"Данный модуль позволяет добавить автоматическое отображение на\u0026nbsp;вашей странице всех существующих релизов из\u0026nbsp;iTunes или\u0026nbsp;BandLink.\",\"app_title__title_2\":\"Этот модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e лишь у\u0026nbsp;двух страниц: Артиста и\u0026nbsp;Лейбла.\",\"the_list__text\":\"Придумайте и\u0026nbsp;впишите цепляющий \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e для данного модуля в\u0026nbsp;одноимённое поле настроек, чтобы привлечь внимание аудитории.\",\"the_list__text_2\":\"Далее выберите один из\u0026nbsp;двух способов отображения музыки на\u0026nbsp;вашей странице:\",\"the_list__text_3\":\"— \u0026nbsp;Показывать релизы из\u0026nbsp;BandLink\",\"the_list__text_4\":\"— \u0026nbsp;Показывать релизы из\u0026nbsp;iTunes\",\"the_list__text_5\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Показывать релизы из\u0026nbsp;BandLink\u0026raquo;\u003c/span\u003e включает автоматическое отображение всех актуальных релизов из\u0026nbsp;BandLink, объединённых одним тегом. То\u0026nbsp;есть, чтобы использовать этот вариант отображения музыки, вы\u0026nbsp;заранее должны создать отдельные смартлинки для ваших релизов и\u0026nbsp;добавить к\u0026nbsp;ним необходимый тег.\",\"the_list__text_6\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Добавить тег\u0026raquo;\u003c/span\u003e служит для добавления тегов, по\u0026nbsp;которым будут автоматически выводиться релизы на\u0026nbsp;вашей странице BandLink. По\u0026nbsp;умолчанию для быстрого выбора доступны последние использованные вами теги.\",\"the_list__text_7\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Показывать релизы из\u0026nbsp;iTunes\u0026raquo;\u003c/span\u003e включает автоматическое отображение всех ваших релизов из\u0026nbsp;профиля артиста на\u0026nbsp;iTunes. При\u0026nbsp;активации этой настройки появится дополнительное поле \u003cspan class='red'\u003e\u0026laquo;Профиль артиста на\u0026nbsp;iTunes\u0026raquo;\u003c/span\u003e\u0026nbsp;\u0026mdash; просто введите ссылку на\u0026nbsp;iTunes, чтобы добавить музыку к\u0026nbsp;вашему смартлинку.\",\"the_list__text_8\":\"\u003cspan class='red'\u003eОбратите внимание\u003c/span\u003e: у\u0026nbsp;вас может быть активна только одна настройка. Поэтому выберите наиболее удачное и\u0026nbsp;удобное для вас решение.\",\"the_list__text_9\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_schedule\":{\"the_promo_background__title\":\"Расписание концертов\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить к\u0026nbsp;вашей страничке BandLink расписание концертов и\u0026nbsp;ссылки на\u0026nbsp;покупку билетов.\",\"the_list__text\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e впишите название для данного модуля странички. Придумайте короткий цепляющий заголовок, чтобы привлечь внимание пользователей, или простой и\u0026nbsp;понятный призыв.\",\"the_list__text_2\":\"Вы\u0026nbsp;можете настроить автоматическое отображение расписания на\u0026nbsp;основе отдельных страниц концертов и\u0026nbsp;туров.\",\"the_list__text_3\":\"Для этого используйте кнопку \u003cspan class='red'\u003e\u0026laquo;Показывать концерты из\u0026nbsp;BandLink\u0026raquo;\u003c/span\u003e. Она\u0026nbsp;активирует автоматический вывод информации обо всех ваших шоу\u0026nbsp;с\u0026nbsp;уже созданных вами актуальных страниц концертов и\u0026nbsp;туров, объединённых одним тегом. То\u0026nbsp;есть, чтобы использовать этот вариант отображения расписания концертов, вы\u0026nbsp;заранее должны создать отдельные смартлинки под ваши выступления и\u0026nbsp;добавить к\u0026nbsp;ним необходимый тег, а\u0026nbsp;потом указать его\u0026nbsp;же в\u0026nbsp;настройках модуля \u0026laquo;Расписание концертов\u0026raquo; в\u0026nbsp;соответствующем поле.\",\"the_list__text_4\":\"Поле \u003cspan class='red'\u003e\u0026laquo;Добавить тег\u0026raquo;\u003c/span\u003e в\u0026nbsp;данном модуле настроек служит для добавления тегов, по\u0026nbsp;которым будет автоматически выводиться расписание ваших концертов и\u0026nbsp;туров. По\u0026nbsp;умолчанию для быстрого выбора доступны последние использованные теги.\",\"the_list__text_5\":\"Также вы\u0026nbsp;можете добавить расписание концертов к\u0026nbsp;вашему смартлинку вручную.\",\"the_list__text_6\":\"Для этого используйте кнопку \u003cspan class='red'\u003e\u0026laquo;Показывать концерты из\u0026nbsp;списка\u0026raquo;\u003c/span\u003e. При\u0026nbsp;её\u0026nbsp;активации появляется кнопка \u003cspan class='red'\u003e\u0026laquo;Добавить событие\u0026raquo;\u003c/span\u003e, с\u0026nbsp;помощью которой вы\u0026nbsp;можете внести информацию об\u0026nbsp;одном или нескольких выступлениях.\",\"the_list__text_7\":\"Заполните все поля в\u0026nbsp;открывшемся меню настроек. Укажите дату, время, а\u0026nbsp;также город/площадку проведения концерта. Добавьте ссылки на\u0026nbsp;мероприятие в\u0026nbsp;социальных сетях. Не\u0026nbsp;забудьте ввести ссылку на\u0026nbsp;онлайн-кассу продажи билетов или её\u0026nbsp;код виджета.\",\"the_list__text_8\":\"При добавлении ссылки обязательно \u003cspan class='red'\u003eиспользуйте полный URL\u003c/span\u003e с\u0026nbsp;указанием http:// или https://.\",\"the_list__text_9\":\"\u003cspan class='red'\u003eПоддерживаемые виджеты\u003c/span\u003e: Radario, TiketsCloud, Ponominalu, YandexAfisha, TimePad. \u003ca href='{contactLink}' target='_blank' class='red'\u003eСвяжитесь с\u0026nbsp;нами\u003c/a\u003e, если нужный код виджета не\u0026nbsp;поддерживается.\",\"the_list__text_10\":\"Нажмите кнопку \u003cspan class='red'\u003e\u0026laquo;Добавить событие\u0026raquo;\u003c/span\u003e, чтобы дополнить ваше расписание концертов и\u0026nbsp;рассказать поклонникам о\u0026nbsp;нескольких выступлениях.\",\"the_list__text_11\":\"Система автоматически сортирует указанные концерты по\u0026nbsp;датам. Поэтому добавлять концерты вы\u0026nbsp;можете в\u0026nbsp;любом порядке и\u0026nbsp;по\u0026nbsp;мере появления новых\u0026nbsp;дат.\",\"the_list__text_12\":\"\u003cspan class='red'\u003eОбратите внимание\u003c/span\u003e: у\u0026nbsp;вас может быть активна только одна настройка этого модуля. То\u0026nbsp;есть вы\u0026nbsp;можете выбрать либо отображение концертов из\u0026nbsp;BandLink, либо отображение концертов из\u0026nbsp;списка.\",\"the_list__text_13\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_external_links\":{\"the_promo_background__title\":\"Внешние ссылки\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить к\u0026nbsp;вашей страничке BandLink ссылки на\u0026nbsp;любые сторонние сайты, которые не\u0026nbsp;относятся к\u0026nbsp;официальным ресурсам и\u0026nbsp;соцсетям: например, ссылки на\u0026nbsp;ваши интервью, курсы, лекции, покупку мерча и\u0026nbsp;что угодно ещё.\",\"the_list__text\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e впишите название для данного модуля странички. Придумайте короткий, понятный и\u0026nbsp;цепляющий заголовок, чтобы привлечь внимание пользователей, вместо стандартного \u0026laquo;Ссылки\u0026raquo;, который отображается на\u0026nbsp;странице BandLink автоматически, даже если вы\u0026nbsp;не\u0026nbsp;заполните данное поле.\",\"the_list__text_2\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Развернуть ссылки\u0026raquo;\u003c/span\u003e включает развёрнутое отображение данного модуля. По\u0026nbsp;умолчанию модуль отображается на\u0026nbsp;вашем смартлинке в\u0026nbsp;свёрнутом виде и\u0026nbsp;раскрывается по\u0026nbsp;клику пользователя. Выберите, какой способ отображения считаете оптимальным.\",\"the_list__text_3\":\"С\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Добавить ссылку\u0026raquo;\u003c/span\u003e добавьте к\u0026nbsp;вашему смартлинку желаемое количество ссылок. Вы\u0026nbsp;также можете изменить их\u0026nbsp;порядок, зажав кнопку в\u0026nbsp;виде девяти точек справа от\u0026nbsp;ссылки и\u0026nbsp;передвинув её\u0026nbsp;на\u0026nbsp;нужное место.\",\"the_list__text_4\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Адрес ссылки\u0026raquo;\u003c/span\u003e укажите рабочий URL внешней ссылки. Используйте полный адрес с\u0026nbsp;указанием \u003cspan class='red'\u003ehttp://\u003c/span\u003e или \u003cspan class='red'\u003ehttps://\u003c/span\u003e.\",\"the_list__text_5\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Название\u0026raquo;\u003c/span\u003e впишите название данной ссылки. Так вы\u0026nbsp;сможете сообщить посетителям вашего смартлинка, какими ссылками и\u0026nbsp;для\u0026nbsp;чего\u0026nbsp;вы\u0026nbsp;с\u0026nbsp;ними делитесь.\",\"the_list__text_6\":\"Чтобы удалить ссылку, наведите на\u0026nbsp;неё мышку\u0026nbsp;\u0026mdash; справа появится \u003cspan class='red'\u003eиконка шестерёнки\u003c/span\u003e. Нажмите на\u0026nbsp;неё, а\u0026nbsp;далее\u0026nbsp;\u0026mdash; \u003cspan class='red'\u003e\u0026laquo;Удалить\u0026raquo;\u003c/span\u003e.\",\"the_list__text_7\":\"После добавления всей нужной информации не\u0026nbsp;забудьте нажать кнопку \u003cspan class='red'\u003e\u0026laquo;Сохранить\u0026raquo;\u003c/span\u003e. Все изменения в\u0026nbsp;настройках смартлинка вы\u0026nbsp;можете оценить в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_qr\":{\"the_promo_background__title\":\"QR-код\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить к\u0026nbsp;вашей страничке BandLink уникальный QR-код и\u0026nbsp;скачать его в\u0026nbsp;высоком качестве для использования на\u0026nbsp;печатной промопродукции для привлечения аудитории офлайн.\",\"the_list__text\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e впишите название для данного модуля странички.\",\"the_list__text_2\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Включить\u0026raquo;\u003c/span\u003e активирует отображение QR-кода на\u0026nbsp;смартлинке. Деактивируйте\u0026nbsp;её, чтобы скрыть QR-код от\u0026nbsp;пользователей. Сам код, генерированный под вашу страницу, при этом сохранится, и\u0026nbsp;вы\u0026nbsp;сможете использовать его для продвижения офлайн.\",\"the_list__text_3\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Развернуть\u0026raquo;\u003c/span\u003e включает развёрнутое отображение данного модуля.\",\"the_list__text_4\":\"С\u0026nbsp;помощью кнопки \u003cspan class='red'\u003e\u0026laquo;Скачать в высоком разрешении\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете скачать PNG-файл с\u0026nbsp;QR-кодом в\u0026nbsp;высоком разрешении 4080*4080, чтобы\u0026nbsp;использовать его для печати на\u0026nbsp;футболках, рекламных баннерах, листовках, афишах, концертных площадках и\u0026nbsp;т.д.\",\"the_list__text_5\":\"Примеры использования QR-кодов в\u0026nbsp;промокампаниях артистов смотрите в\u0026nbsp;нашем телеграм-канале. \u003ca href='{exampleLink}' target='_blank' class='red'\u003eВот один из них\u003c/a\u003e.\",\"the_list__text_6\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_contacts\":{\"the_promo_background__title\":\"Контакты\",\"app_title__title\":\"Данный модуль позволяет добавить к\u0026nbsp;вашей странице BandLink контактные данные для связи с\u0026nbsp;вами.\",\"app_title__title_2\":\"Этот модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e лишь у\u0026nbsp;четырёх страниц BandLink: Артиста, Подкастера, Лейбла и\u0026nbsp;Клуба.\",\"the_list__text\":\"Придумайте цепляющий и\u0026nbsp;понятный заголовок и\u0026nbsp;впишите его\u0026nbsp;в\u0026nbsp;соответствующее поле, чтобы привлечь внимание ваших фанатов.\",\"the_list__text_2\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Развернуть контакты\u0026raquo;\u003c/span\u003e включает развёрнутое отображение данного модуля. По\u0026nbsp;умолчанию модуль отображается в\u0026nbsp;свёрнутом виде.\",\"the_list__text_3\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Контакты\u0026raquo;\u003c/span\u003e укажите доступные каналы, с\u0026nbsp;помощью которых ваша аудитория может с\u0026nbsp;вами связаться. Например, напишите своё имя и\u0026nbsp;адрес электронной почты или номер телефона.\",\"the_list__text_4\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_subscription\":{\"the_promo_background__title\":\"Подписка\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Вид\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет добавить к\u0026nbsp;вашей страничке BandLink блок, который поможет собрать базу фанатов для рассылки уведомлений о\u0026nbsp;новых релизах, концертах и\u0026nbsp;т.п\",\"the_list__text\":\"В\u0026nbsp;поле \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e впишите название для данного модуля странички. Придумайте короткий цепляющий заголовок, чтобы привлечь внимание пользователей. Чтобы побудить их\u0026nbsp;подписаться на\u0026nbsp;вашу рассылку, используйте понятный прямой призыв к\u0026nbsp;действию. По\u0026nbsp;определению этот модуль на\u0026nbsp;странице BandLink получает заголовок \u0026laquo;Подписка\u0026raquo;, даже если вы\u0026nbsp;не\u0026nbsp;заполняете данное поле.\",\"the_list__text_2\":\"С\u0026nbsp;помощью кнопок включения/выключения добавьте модуль сбора email адресов или никнеймов в\u0026nbsp;Telegram ваших фанатов. Вы\u0026nbsp;можете использовать как один, так и\u0026nbsp;оба канала для связи с\u0026nbsp;аудиторией.\",\"the_list__text_3\":\"Подключая модуль подписки в\u0026nbsp;Telegram, выберите один из\u0026nbsp;двух вариантов: \u003cspan class='red'\u003eчерез бота\u003c/span\u003e или \u003cspan class='red'\u003eчерез ссылку\u003c/span\u003e\u0026nbsp;\u0026mdash; и\u0026nbsp;нажмите соответствующую кнопку.\",\"the_list__text_4\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Включить Telegram подписку через бота\u0026raquo;\u003c/span\u003e позволяет рассылать оповещения всем фанатам, которые подписались на\u0026nbsp;наш Telegram-бот. Рекомендуется, если у\u0026nbsp;вас нет своего Telegram-канала: уведомление подписчиков будет производиться через бота BandLink.\",\"the_list__text_5\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Включить Telegram подписку через ссылку\u0026raquo;\u003c/span\u003e позволяет добавить инвайтную или прямую ссылку на\u0026nbsp;ваш Telegram-канал. Используя этот способ, не\u0026nbsp;забудьте добавить ссылку на\u0026nbsp;ваш канал в\u0026nbsp;соответствующем поле. Ниже под полем для ссылки вы\u0026nbsp;сможете увидеть количество пользователей, которые кликнули на\u0026nbsp;ваш канал.\",\"the_list__text_6\":\"В\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Рассылка\u0026raquo;\u003c/span\u003e будет отображаться количество фанатов, подписавшихся на\u0026nbsp;ваши уведомления. Добавьте новую информацию на\u0026nbsp;ваш\u0026nbsp;смартлинк и\u0026nbsp;нажмите на\u0026nbsp;кнопку \u003cspan class='red'\u003e\u0026laquo;Уведомить подписчиков\u0026raquo;\u003c/span\u003e, чтобы\u0026nbsp;они первые узнали о\u0026nbsp;важных новостях.\",\"the_list__text_7\":\"Так, например, вы\u0026nbsp;можете добавить к\u0026nbsp;своей странице BandLink информацию о\u0026nbsp;будущих концертах и\u0026nbsp;сообщить об\u0026nbsp;этом подписавшимся на\u0026nbsp;уведомления слушателям.\",\"the_list__text_8\":\"Рассылка уведомлений производится один раз, поэтому убедитесь, что\u0026nbsp;страница полностью готова.\",\"the_list__text_9\":\"В\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Сообщение\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете отправить фанатам, которые подписались на\u0026nbsp;вас с\u0026nbsp;помощью данного модуля, адресное письмо. Введите текст в\u0026nbsp;соответствующее поле\u0026nbsp;\u0026mdash; кнопка \u003cspan class='red'\u003e\u0026laquo;Отправить сообщение\u0026raquo;\u003c/span\u003e станет активной. Нажмите\u0026nbsp;её, чтобы отправить письмо подписчикам.\",\"the_list__text_10\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e рассылка уведомлений и\u0026nbsp;сообщений происходит по\u0026nbsp;email и\u0026nbsp;через Telegram бота. Если вы\u0026nbsp;настраивали Telegram подписку через ссылку, слушатели подпишутся на\u0026nbsp;ваш\u0026nbsp;канал, где вы\u0026nbsp;сами сможете рассказывать им\u0026nbsp;все важные новости проекта.\",\"the_list__text_11\":\"Все изменения в\u0026nbsp;настройках страницы сохраняются автоматически. Вы\u0026nbsp;можете оценить их\u0026nbsp;в\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Превью страницы\u0026raquo;\u003c/span\u003e справа от\u0026nbsp;окна настроек.\"},\"modules_analytics\":{\"the_promo_background__title\":\"Сервисы аналитики\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Продвижение\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет подключить к\u0026nbsp;вашей странице BandLink сторонние сервисы аналитики для детального анализа аудитории.\",\"the_list__text\":\"Вы\u0026nbsp;можете добавить к\u0026nbsp;своей странице BandLink коды Google Analytics и\u0026nbsp;Яндекс Метрики. Для этого введите\u0026nbsp;ID аккаунта в\u0026nbsp;соответствующих полях.\",\"the_list__text_2\":\"Коды Google Analytics и\u0026nbsp;Яндекс Метрики помогут собрать подробную аналитику действий пользователей, кликнувших на\u0026nbsp;вашу ссылку.\",\"the_list__text_3\":\"Код \u003cspan class='red'\u003eGoogle Analytics\u003c/span\u003e генерируется в\u0026nbsp;аккаунте Google Analytics и\u0026nbsp;имеет следующий вид: UA-XXXXX-Y. При использовании Google Tag Manager в\u0026nbsp;модуле настроек \u003cspan class='red'\u003e\u0026laquo;Ретаргетинг\u0026raquo;\u003c/span\u003e данное поле не\u0026nbsp;заполняется для избежания дублирования данных\",\"the_list__text_4\":\"Подробнее о\u0026nbsp;работе с\u0026nbsp;этим сервисом можно узнать \u003ca href='{googleLink}' target='_blank' class='red'\u003eздесь\u003c/a\u003e.\",\"the_list__text_5\":\"Для вставки кода \u003cspan class='red'\u003eЯндекс Метрики\u003c/span\u003e нужен цифровой идентификатор отслеживания из\u0026nbsp;кабинета Яндекс Метрики.\",\"the_list__text_6\":\"Вы\u0026nbsp;можете узнать больше об\u0026nbsp;использовании этого сервиса \u003ca href='{yandexLink}' target='_blank' class='red'\u003eздесь\u003c/a\u003e.\",\"the_list__text_7\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e вы\u0026nbsp;можете добавлять коды Google Analytics и\u0026nbsp;Яндекс Метрики вручную к\u0026nbsp;каждой или отдельным страницам BandLink, а\u0026nbsp;можете один раз указать их\u0026nbsp;в\u0026nbsp;соответствующем блоке раздела \u003cspan class='red'\u003e\u0026laquo;Настройки\u0026raquo;\u003c/span\u003e в\u0026nbsp;личном кабинете\u0026nbsp;\u0026mdash; так коды аналитики будут автоматически прописываться в\u0026nbsp;каждом новом смартлинке.\",\"the_list__text_8\":\"Все изменения в\u0026nbsp;настройках модуля сохраняются автоматически.\"},\"modules_seo\":{\"the_promo_background__title\":\"SEO-оптимизация\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Продвижение\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет настроить заголовок и\u0026nbsp;описание страницы BandLink для\u0026nbsp;предварительного просмотра ссылки в\u0026nbsp;социальных сетях и\u0026nbsp;лучшей поисковой оптимизации (SEO).\",\"the_list__text\":\"SEO-оптимизация помогает поднять вашу страничку в\u0026nbsp;результатах выдачи различных поисковых систем\u0026nbsp;и, таким образом, увеличивает полезный трафик на\u0026nbsp;смартлинк, его эффективность и\u0026nbsp;конверсию.\",\"the_list__text_2\":\"Впишите цепляющий ёмкий \u003cspan class='red'\u003e\u0026laquo;Заголовок\u0026raquo;\u003c/span\u003e в\u0026nbsp;одноимённое поле. Так будет называться ваша страница в\u0026nbsp;строке браузера. Учитывая стандарты большинства поисковиков, старайтесь уложиться в\u0026nbsp;60\u0026ndash;70 символов с\u0026nbsp;пробелами.\",\"the_list__text_3\":\"Заполните поле \u003cspan class='red'\u003e\u0026laquo;Описание\u0026raquo;\u003c/span\u003e: напишите текст, отображающий суть вашей странички. Он\u0026nbsp;также будет выводиться в\u0026nbsp;поисковых системах как сниппет\u0026nbsp;\u0026mdash; описание под заголовком. Оптимальный размер описания\u0026nbsp;\u0026mdash; 160\u0026nbsp;символов.\",\"the_list__text_4\":\"Не\u0026nbsp;забудьте при составлении описания использовать релевантные смысловые ключи. Для их\u0026nbsp;подбора используйте онлайн-сервисы, например, Wordstat: он\u0026nbsp;поможет оценить пользовательский интерес к\u0026nbsp;конкретным темам и\u0026nbsp;частотность конкретных тегов. Так вы\u0026nbsp;сможете выбрать наиболее эффективные ключи или похожие на\u0026nbsp;них запросы.\",\"the_list__text_5\":\"\u003cspan class='red'\u003eУчтите:\u003c/span\u003e чем популярнее тег, тем больше потенциальная аудитория, но\u0026nbsp;и\u0026nbsp;тем\u0026nbsp;выше конкуренция в\u0026nbsp;поисковиках с\u0026nbsp;другими похожими страничками.\",\"the_list__text_6\":\"В\u0026nbsp;разделе \u003cspan class='red'\u003e\u0026laquo;Изображение для публикаций\u0026raquo;\u003c/span\u003e вы\u0026nbsp;можете загрузить изображение с\u0026nbsp;вашего устройства. (размер: не\u0026nbsp;более 10\u0026nbsp;МБ; формат: JPG, PNG). В\u0026nbsp;первую очередь это важно для предварительного просмотра ссылки в\u0026nbsp;соцсетях: так вместе с\u0026nbsp;ссылкой к\u0026nbsp;вашему посту подтянется выбранное вами изображение.\",\"the_list__text_7\":\"Также вы\u0026nbsp;можете добавить \u003cspan class='red'\u003eкод верификации\u0026nbsp;ВК\u003c/span\u003e в\u0026nbsp;соответствующем поле настроек.\",\"the_list__text_8\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Индексировать страницу\u0026raquo;\u003c/span\u003e позволяет исключить вашу страницу из\u0026nbsp;файла карты сайта (sitemap.xml), а\u0026nbsp;также из\u0026nbsp;списка \u0026laquo;Все страницы\u0026raquo;.\",\"the_list__text_9\":\"Обратите внимание: это может помешать поиску страницы в\u0026nbsp;поисковых системах.\",\"the_list__text_10\":\"Все изменения в\u0026nbsp;настройках модуля сохраняются автоматически.\"},\"modules_retargeting\":{\"the_promo_background__title\":\"Ретаргетинг\",\"app_title__title\":\"Данный модуль находится в\u0026nbsp;разделе настроек \u003cspan class='red'\u003e\u0026laquo;Продвижение\u0026raquo;\u003c/span\u003e и\u0026nbsp;позволяет подключить к\u0026nbsp;вашей странице BandLink пиксели ретаргетинга для сбора аудитории и\u0026nbsp;дальнейшей настройки таргетированных рекламных кампаний.\",\"the_list__text\":\"В\u0026nbsp;настройках данного модуля вы\u0026nbsp;можете подключить к\u0026nbsp;своему смартлинку пиксели ретаргетинга Facebook*, ВКонтакте, VK\u0026nbsp;Рекламы, TikTok, Google Ads и\u0026nbsp;Google Tag Manager.\",\"the_list__text_2\":\"\u003cspan class='red'\u003eПиксель Facebook\u003c/span\u003e*\u0026nbsp;\u0026mdash; это инструмент аналитики, с\u0026nbsp;помощью которого можно измерить результативность рекламы. Вы\u0026nbsp;можете использовать пиксель Facebook* для изучения действий пользователей и\u0026nbsp;охвата нужной аудитории. Для вставки нужен 16-ти значный код пикселя из\u0026nbsp;рекламного кабинета Facebook*.\",\"the_list__text_3\":\"Подробнее о\u0026nbsp;создании пикселя можно узнать \u003ca href='{facebookLink}' target='_blank' class='red'\u003eздесь\u003c/a\u003e.\",\"the_list__text_4\":\"Кнопка \u003cspan class='red'\u003e\u0026laquo;Параметры пикселя\u0026raquo;\u003c/span\u003e показывает пример пикселя.\",\"the_list__text_5\":\"\u003cspan class='red'\u003eПиксель ВКонтакте\u003c/span\u003e поможет собрать вашу аудиторию во\u0026nbsp;ВКонтакте для\u0026nbsp;дальнейшего таргетированного продвижения в\u0026nbsp;данной соцсети. Пиксель генерируется в\u0026nbsp;рекламном кабинете ВКонтакте и\u0026nbsp;имеет следующий вид: VK‑RTRG-xxxxxx-xxxxх.\",\"the_list__text_6\":\"Подробнее о\u0026nbsp;создании пикселя можно узнать \u003ca href='{vkLink}' target='_blank' class='red'\u003eздесь\u003c/a\u003e.\",\"the_list__text_7\":\"\u003cspan class='red'\u003eПиксель VK\u0026nbsp;Рекламы\u003c/span\u003e (VK\u0026nbsp;Ads) позволяет собирать информацию о\u0026nbsp;посетителях вашего смартлинка (визиты, просмотры страницы, отслеживание действий и\u0026nbsp;т.д.) с\u0026nbsp;целью её\u0026nbsp;дальнейшего анализа и\u0026nbsp;оптимизации рекламы, а\u0026nbsp;также отслеживать конверсии и\u0026nbsp;создавать собственные аудитории для рекламных кампаний.\",\"the_list__text_8\":\"Подробнее о\u0026nbsp;пикселе VK\u0026nbsp;Рекламы можно узнать \u003ca href='{vkAdsLink}' target='_blank' class='red'\u003eздесь\u003c/a\u003e.\",\"the_list__text_9\":\"\u003cspan class='red'\u003eПиксель TikTok\u003c/span\u003e поможет собрать вашу аудиторию для дальнейшего таргетированного продвижения в\u0026nbsp;данной соцсети. Пиксель генерируется в\u0026nbsp;рекламном кабинете TikTok.\",\"the_list__text_10\":\"Подробнее о\u0026nbsp;создании пикселя можно узнать \u003ca href='{tikTokLink}' target='_blank' class='red'\u003eздесь\u003c/a\u003e.\",\"the_list__text_11\":\"\u003cspan class='red'\u003eGoogle Ads\u003c/span\u003e поможет собрать вашу аудиторию для дальнейшего таргетированного продвижения с\u0026nbsp;помощью данного сервиса. Пиксель генерируется в\u0026nbsp;аккаунте Google Ads и\u0026nbsp;имеет следующий вид: AW-ххххххххх.\",\"the_list__text_12\":\"Подробнее о\u0026nbsp;создании пикселя можно узнать \u003ca href='{googleAdsLink}' target='_blank' class='red'\u003eздесь\u003c/a\u003e.\",\"the_list__text_13\":\"\u003cspan class='red'\u003eGoogle Tag Manager\u003c/span\u003e\u0026nbsp;\u0026mdash; это инструмент, который предоставляет единый интерфейс для управления пикселями (Facebook*, Вконтакте, Google Ads\u0026nbsp;и\u0026nbsp;т.п.) и\u0026nbsp;аналитики аудитории (Google Analytics) вашей страницы. Код\u0026nbsp;генерируется в\u0026nbsp;аккаунте Google Tag Manager и\u0026nbsp;имеет следующий вид: GTM-xxxxxx.\",\"the_list__text_14\":\"Подробнее о\u0026nbsp;работе с\u0026nbsp;этим сервисом можно узнать \u003ca href='{googleTagManagerLink}' target='_blank' class='red'\u003eздесь\u003c/a\u003e.\",\"the_list__text_15\":\"\u003cspan class='red'\u003eОбратите внимание:\u003c/span\u003e при использовании Google Tag Manager для работы с\u0026nbsp;вашими пикселями или аналитикой заполнение поля Google Ads в\u0026nbsp;модуле \u0026laquo;Ретаргетинг\u0026raquo; не\u0026nbsp;рекомендуется во\u0026nbsp;избежание дублирования данных.\",\"the_list__text_16\":\"Про бесплатную внутреннюю аналитику BandLink можно прочитать \u003ca href='{BandLinkLink}' target='_blank' class='red'\u003eздесь\u003c/a\u003e.\",\"the_li
